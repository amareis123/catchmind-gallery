// ---------------- API ----------------
async function loadGallery(id){
  try {
    const { data, error } = await supabaseClient.from('gallery').select('*').eq('id', id).maybeSingle();
    if(error || !data) return null;
    return { ...data, banned_visitors: data.banned_visitors || [] };
  } catch(e){ return null; }
}

async function saveGallery(id, obj){
  try {
    const { error } = await supabaseClient.from('gallery').upsert({
      id: id,
      owner_key: obj.owner_key || genId(16),
      title: obj.title || '나만의 갤러리',
      is_public: obj.is_public !== undefined ? obj.is_public : true,
      cover_image: obj.cover_image || '',
      topic: obj.topic || '',
      banned_visitors: obj.banned_visitors || []
    }, { onConflict: 'id' }).select();
    if(error) console.error("Gallery save error:", error);
    return !error;
  } catch(e){ return false; }
}

async function loadPublicGalleries(query=''){
  try {
    let q = supabaseClient.from('gallery').select('*').eq('is_public', true);
    if(query) q = q.ilike('title', `%${query}%`);
    const { data, error } = await q;
    return error ? [] : data;
  } catch(e){ return []; }
}

    return renderVisitor(parts[0], parts[1]);
  }
  if(hash.startsWith('visit=')) return renderVisitor(hash.slice(6));
  return renderHome();
}
addEventListener('hashchange', route);

window.addEventListener('keydown', (e) => {
  const activeEl = document.activeElement;
  if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;
  if (e.ctrlKey || e.metaKey) {
    if (e.key.toLowerCase() === 'z') {
      if (e.shiftKey) { redo(); } else { undo(); }
      e.preventDefault();
    } else if (e.key.toLowerCase() === 'y') {
      redo();
      e.preventDefault();
    }
  }
});

function determineGalleryCover(gallery, visibleSubs){
  if(visibleSubs.length === 0) return null;
  if(gallery.cover_image && visibleSubs.some(s=>s.image === gallery.cover_image)) return gallery.cover_image;
  const pinnedSubs = visibleSubs.filter(s => s.pinned);
  if(pinnedSubs.length > 0) return pinnedSubs[Math.floor(Math.random() * pinnedSubs.length)].image;
  const maxLikes = Math.max(...visibleSubs.map(s => s.likes || 0));
  if(maxLikes > 0){
    const topLikedSubs = visibleSubs.filter(s => (s.likes || 0) === maxLikes);
    return topLikedSubs[Math.floor(Math.random() * topLikedSubs.length)].image;
  }
  return visibleSubs[0].image;
}

// ---------------- Multi-Layer Engine & Canvas System ----------------
function getRgbaColor(hex, opacity){
  let c = hex.replace('#','');
  if(c.length === 3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c, 16);
  return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${opacity})`;
}

function saveState(){
  if(undoStack.length >= MAX_UNDO) undoStack.shift();
  const snapshot = layers.map(layer => {
    const ctx = layer.canvas.getContext('2d');
    return {
      id: layer.id,
      name: layer.name,
      visible: layer.visible,
      opacity: layer.opacity,
      imgData: ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height)
    };
  });
  undoStack.push({ snapshot, activeIndex: activeLayerIndex });
  redoStack = [];
}

function undo(){
  if(undoStack.length <= 1) return;
  redoStack.push(undoStack.pop());
  const state = undoStack[undoStack.length - 1];
  restoreState(state);
}

function redo(){
  if(redoStack.length === 0) return;
  const state = redoStack.pop();
  undoStack.push(state);
  restoreState(state);
}

function restoreState(state){
  const containerId = isMobileDevice() ? 'mobileCanvasContainer' : 'canvasContainer';
  const container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = '';
  layers = [];

  state.snapshot.forEach(item => {
    const canvas = document.createElement('canvas');
    canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
    canvas.style.opacity = item.opacity;
    canvas.style.display = item.visible ? 'block' : 'none';
    const ctx = canvas.getContext('2d');
    ctx.putImageData(item.imgData, 0, 0);
    container.appendChild(canvas);
    layers.push({ id: item.id, name: item.name, visible: item.visible, opacity: item.opacity, canvas });
  });

  activeLayerIndex = Math.min(state.activeIndex, layers.length - 1);
  renderLayerUI();
}

function clearUndoHistory(){
  undoStack = [];
  redoStack = [];
}

function addLayer(name, initialImageSrc=null){
  if(layers.length >= 10){ alert('레이어는 최대 10개까지 추가 가능합니다.'); return; }
  const containerId = isMobileDevice() ? 'mobileCanvasContainer' : 'canvasContainer';
  const container = document.getElementById(containerId);
  const canvas = document.createElement('canvas');
  canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
  
  layerIdCounter++;
  const layerName = name || `레이어 ${layerIdCounter}`;
  container.appendChild(canvas);

  const newLayer = { id: layerIdCounter, name: layerName, visible: true, opacity: 1.0, canvas };
  layers.push(newLayer);
  activeLayerIndex = layers.length - 1;

  if(initialImageSrc){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      saveState();
      renderLayerUI();
    };
    img.src = initialImageSrc;
  } else {
    saveState();
    renderLayerUI();
  }
}

function removeLayer(index){
  if(layers.length <= 1){ alert('최소 1개의 레이어가 필요합니다.'); return; }
  layers[index].canvas.remove();
  layers.splice(index, 1);
  if(activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
  saveState();
  renderLayerUI();
}

function moveLayer(index, dir){
  const newIndex = index + dir;
  if(newIndex < 0 || newIndex >= layers.length) return;

  const temp = layers[index];
  layers[index] = layers[newIndex];
  layers[newIndex] = temp;

  const containerId = isMobileDevice() ? 'mobileCanvasContainer' : 'canvasContainer';
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  layers.forEach(l => container.appendChild(l.canvas));

  activeLayerIndex = newIndex;
  saveState();
  renderLayerUI();
}

function renameLayer(index){
  const currentName = layers[index].name;
  const newName = prompt('변경할 레이어 이름을 입력하세요:', currentName);
  if(newName !== null && newName.trim() !== ''){
    layers[index].name = newName.trim();
    saveState();
    renderLayerUI();
  }
}

function renderLayerUI(){
  const list = document.getElementById('layerList');
  if(!list) return;
  list.innerHTML = '';

  for(let i = layers.length - 1; i >= 0; i--){
    const layer = layers[i];
    const item = document.createElement('div');
    item.className = `layer-item ${i === activeLayerIndex ? 'active' : ''}`;
    item.onclick = () => { activeLayerIndex = i; renderLayerUI(); };

    item.innerHTML = `
      <span>${layer.visible ? '👁️' : '🙈'} <span class="layer-name-title" onclick="event.stopPropagation(); renameLayer(${i});" title="이름 변경">${escapeHtml(layer.name)}</span></span>
      <div class="btn-group" onclick="event.stopPropagation()">
        <button class="ghost" onclick="renameLayer(${i})" title="이름 변경">✏️</button>
        <button class="ghost" onclick="toggleLayerVis(${i})">${layer.visible ? '숨기기' : '보이기'}</button>
        <button class="ghost" onclick="moveLayer(${i}, 1)">▲</button>
        <button class="ghost" onclick="moveLayer(${i}, -1)">▼</button>
        <button class="danger" onclick="removeLayer(${i})">✕</button>
      </div>
    `;
    list.appendChild(item);
  }
}

function toggleLayerVis(index){
  layers[index].visible = !layers[index].visible;
  layers[index].canvas.style.display = layers[index].visible ? 'block' : 'none';
  saveState();
  renderLayerUI();
}

function floodFill(canvas, startX, startY, fillColorRgba){
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;

  const temp = document.createElement('div');
  temp.style.color = fillColorRgba;
  document.body.appendChild(temp);
  const cs = window.getComputedStyle(temp).color.match(/[\d.]+/g).map(Number);
  document.body.removeChild(temp);

  const fillR = cs[0], fillG = cs[1], fillB = cs[2], fillA = Math.round((cs[3] !== undefined ? cs[3] : 1) * 255);
  const targetIdx = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
  const startR = data[targetIdx], startG = data[targetIdx+1], startB = data[targetIdx+2], startA = data[targetIdx+3];

  if(Math.abs(startR - fillR) < 5 && Math.abs(startG - fillG) < 5 && Math.abs(startB - fillB) < 5 && Math.abs(startA - fillA) < 5) return;

  function matchColor(idx){
    return Math.abs(data[idx] - startR) < 32 && Math.abs(data[idx+1] - startG) < 32 &&
           Math.abs(data[idx+2] - startB) < 32 && Math.abs(data[idx+3] - startA) < 32;
  }

  const queue = [[Math.floor(startX), Math.floor(startY)]];
  const width = canvas.width, height = canvas.height;

  while(queue.length > 0){
    const [x, y] = queue.pop();
    const idx = (y * width + x) * 4;
    if(matchColor(idx)){
      data[idx] = fillR; data[idx+1] = fillG; data[idx+2] = fillB; data[idx+3] = fillA;
      if(x > 0) queue.push([x - 1, y]);
      if(x < width - 1) queue.push([x + 1, y]);
      if(y > 0) queue.push([x, y - 1]);
      if(y < height - 1) queue.push([x, y + 1]);
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function setupMultiLayerStudio(galleryId, initialBgImage = null){
  currentActiveGalleryId = galleryId;
  const containerId = isMobileDevice() ? 'mobileCanvasContainer' : 'canvasContainer';
  const container = document.getElementById(containerId);
  if(!container) return;
  
  container.innerHTML = '';
  layers = [];
  layerIdCounter = 0;
  clearUndoHistory();

  addLayer('배경 레이어', initialBgImage);
  
  let last = null;
  let isFramePending = false;

  function pos(e){
    const rect = container.getBoundingClientRect();
    return { 
      x: (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width), 
      y: (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height)
    };
  }

  function start(e){
    if(layers.length === 0 || !layers[activeLayerIndex].visible) return;
    e.preventDefault();
    const p = pos(e);
    const activeCanvas = layers[activeLayerIndex].canvas;
    const activeColor = getRgbaColor(currentBrush.color, currentBrush.opacity);

    if(currentBrush.tool === 'fill'){
      floodFill(activeCanvas, p.x, p.y, activeColor);
      saveState();
      return;
    }
    drawing = true; last = p;
  }

  function move(e){
    if(!drawing || currentBrush.tool === 'fill') return; 
    e.preventDefault();
    const p = pos(e);

    if(!isFramePending){
      isFramePending = true;
      requestAnimationFrame(()=>{
        const activeCanvas = layers[activeLayerIndex].canvas;
        const ctx = activeCanvas.getContext('2d');
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        
        let calculatedWidth = currentBrush.size;
        if (e.pointerType === 'pen' && e.pressure > 0) calculatedWidth = currentBrush.size * (e.pressure * 2); 
        ctx.lineWidth = Math.max(0.5, calculatedWidth);

        if(currentBrush.tool === 'eraser'){
          ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = getRgbaColor(currentBrush.color, currentBrush.opacity);
        }

        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p; isFramePending = false;
      });
    }
  }

  function end(){ if(drawing){ drawing = false; saveState(); } }

  container.addEventListener('pointerdown', start);
  container.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
}

function bindBrushControls(scope){
  scope.querySelectorAll('.swatch, .mobile-swatch').forEach(s=>{
    s.onclick = ()=>{ 
      currentBrush.color = s.dataset.color; 
      scope.querySelectorAll('.swatch, .mobile-swatch').forEach(x=>x.classList.remove('active')); 
      s.classList.add('active'); 
      const pcPicker = scope.querySelector('#customColorPicker');
      const mobilePicker = scope.querySelector('#mobileCustomColorPicker');
      if(pcPicker) pcPicker.value = currentBrush.color.length === 7 ? currentBrush.color : '#26251f';
      if(mobilePicker) mobilePicker.value = currentBrush.color.length === 7 ? currentBrush.color : '#26251f';
    };
  });

  const colorPicker = scope.querySelector('#customColorPicker');
  if(colorPicker){
    colorPicker.oninput = (e)=>{
      currentBrush.color = e.target.value;
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
    };
  }

  const mobileColorPicker = scope.querySelector('#mobileCustomColorPicker');
  if(mobileColorPicker){
    mobileColorPicker.oninput = (e)=>{
      currentBrush.color = e.target.value;
      scope.querySelectorAll('.mobile-swatch').forEach(x=>x.classList.remove('active'));
    };
  }

  const tBrush = scope.querySelector('#toolBrush, #mobileToolBrush');
  const tEraser = scope.querySelector('#toolEraser, #mobileToolEraser');
  const tFill = scope.querySelector('#toolFill, #mobileToolFill');

  if(tBrush && tEraser && tFill){
    tBrush.onclick = ()=>{ currentBrush.tool='brush'; tBrush.classList.add('active'); tEraser.classList.remove('active'); tFill.classList.remove('active'); };
    tEraser.onclick = ()=>{ currentBrush.tool='eraser'; tEraser.classList.add('active'); tBrush.classList.remove('active'); tFill.classList.remove('active'); };
    tFill.onclick = ()=>{ currentBrush.tool='fill'; tFill.classList.add('active'); tBrush.classList.remove('active'); tEraser.classList.remove('active'); };
  }

  const sizeInput = scope.querySelector('#brushSize, #mobileBrushSize');
  const sizeVal = scope.querySelector('#brushSizeVal, #mobileBrushSizeVal');
  if(sizeInput && sizeVal){
    sizeInput.oninput = (e)=>{ 
      currentBrush.size = parseInt(e.target.value); 
      sizeVal.textContent = `${currentBrush.size}px`;
    };
  }

  const opInput = scope.querySelector('#brushOpacity, #mobileBrushOpacity');
  const opVal = scope.querySelector('#brushOpacityVal, #mobileBrushOpacityVal');
  if(opInput && opVal){
    opInput.oninput = (e)=>{
      const val = parseInt(e.target.value);
      currentBrush.opacity = val / 100;
      opVal.textContent = `${val}%`;
    };
  }

  const undoBtn = scope.querySelector('#undoBtn, #mobileUndoBtn');
  if(undoBtn) undoBtn.onclick = () => undo();

  const redoBtn = scope.querySelector('#redoBtn');
  if(redoBtn) redoBtn.onclick = () => redo();

  const clearBtn = scope.querySelector('#clearBtn, #mobileClearBtn');
  if(clearBtn){
    clearBtn.onclick = ()=>{
      if(confirm('전체 그리기 영역을 초기화하시겠습니까?')){
        setupMultiLayerStudio(currentActiveGalleryId);
      }
    };
  }
}

    if(delGBtn){
      delGBtn.onclick = async ()=>{
        if(confirm('이 갤러리를 완전히 삭제하시겠습니까?')){
          await supabaseClient.from('submissions').delete().eq('gallery_id', id);
          await supabaseClient.from('gallery').delete().eq('id', id);
          alert('갤러리가 삭제되었습니다.');
          location.hash = '';
        }
      };
    }
  }

  setupMultiLayerStudio(id);
  bindBrushControls(document);

  document.getElementById('submitBtn').onclick = async ()=>{
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('submitMsg');
    
    if(isBanned){
      msg.textContent = '차단된 사용자는 업로드할 수 없습니다.'; msg.className = 'msg no';
      return;
    }

    submitBtn.disabled = true;
    msg.textContent = '처리 중...'; msg.className = 'msg';

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = CANVAS_WIDTH; tempCanvas.height = CANVAS_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    
    tempCtx.fillStyle = '#ffffff';
    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

    layers.forEach(l => {
      if(l.visible){
        tempCtx.globalAlpha = l.opacity;
        tempCtx.drawImage(l.canvas, 0, 0);
      }
    });

    const image = tempCanvas.toDataURL('image/png');
    const author = document.getElementById('authorName').value.trim() || '익명';
    localStorage.setItem('visitor-nickname', author);

    if(activeRemixTarget){
      const ok = await addComment(activeRemixTarget.subId, author, '난 이렇게 고쳤다 ㅋㅋ', image);
      submitBtn.disabled = false;

      if(ok){
        msg.textContent = '원작 그림의 댓글에 리믹스 등록 완료! 🎉'; msg.className='msg ok';
        activeRemixTarget = null;
        document.getElementById('remixBanner').style.display = 'none';
        document.getElementById('studioTitle').innerHTML = `✏️ 새 낙서 그리기 ${isMobile ? '<span class="badge public">모바일 모드</span>' : ''}`;
        submitBtn.innerText = '새 작품 등록하기';
        clearUndoHistory();
        setupMultiLayerStudio(id);
        refreshFeed();
      } else {
        msg.textContent = '댓글 등록에 실패했습니다. (Supabase RLS 권한을 확인해 주세요)'; msg.className='msg no';
      }
    } else {
      const lastUpload = parseInt(localStorage.getItem(`last-upload-${id}`) || '0');
      const now = Date.now();
      if (now - lastUpload < 10000) {
        msg.textContent = `⚡ 도배 방지: ${Math.ceil((10000 - (now - lastUpload)) / 1000)}초 후 다시 시도해주세요.`;
        msg.className = 'msg no';
        submitBtn.disabled = false;
        return;
      }

      const ok = await addSub(id, { id: genId(10), author, image });
      submitBtn.disabled = false;

      if(ok){
        localStorage.setItem(`last-upload-${id}`, Date.now());
        clearUndoHistory();
        setupMultiLayerStudio(id);

        msg.textContent = '새 작품 제출 완료! 🎉'; msg.className='msg ok';
        refreshFeed();
      } else {
        msg.textContent = '업로드에 실패했습니다. (Supabase RLS 권한을 확인해 주세요)'; msg.className='msg no';
      }
    }
  };

  document.getElementById('sortSelect').onchange = (e)=>{
    currentSort = e.target.value;
    refreshFeed();
  };

  async function refreshFeed(){
    if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

    let subs = await loadSubs(id);
    if(!canManage || !showPrivateFilter) subs = subs.filter(s=>!s.hidden); 

    const feed = document.getElementById('subFeed');
    if(!feed) return;
    if(subs.length === 0){ feed.innerHTML = '<span class="small">표시할 그림이 없습니다.</span>'; return; }

    subs.sort((a,b)=>{
      if(b.pinned !== a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
      if(currentSort === 'popular') return (b.likes||0) - (a.likes||0);
      if(currentSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
      if(currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
    });

    let html = '';
    for(const s of subs){
      const isMine = s.visitor_id === myVid;
      const isLiked = (s.likedBy || []).includes(myVid);
      const isCover = (gallery.cover_image === s.image);
      const isAuthorBanned = (gallery.banned_visitors || []).includes(s.visitor_id);
      const comments = await loadComments(s.id);

      html += `
        <div class="thumb-card ${s.pinned ? 'pinned-card' : ''} ${s.hidden ? 'hidden-card' : ''}" data-sid="${s.id}">
          <span class="author">👤 ${escapeHtml(s.author || '익명')} ${isMine?'(나)':''} ${isAuthorBanned ? '<span class="badge banned">차단됨</span>':''}</span>
          ${isCover ? '<span class="badge public">🖼️ 대표 썸네일</span>' : ''}
          ${s.pinned ? '<span class="badge pinned">📌 고정됨</span>' : ''}
          ${s.hidden ? '<span class="badge hidden">🔒 비공개</span>' : ''}
          <img src="${s.image}" onclick="openModal('${s.image}', '${escapeHtml(s.author || '익명')}님의 작품')">
          
          <button class="like-btn ${isLiked ? 'liked' : ''}" data-sid="${s.id}">
            ${isLiked ? '💖 좋아요 완료' : '🤍 좋아요'} (${s.likes||0})
          </button>
          
          <button class="secondary remixBtn" style="width:100%; margin-top:4px; font-size:11px;">🖌️ 그림 가져와서 수정 (리믹스)</button>

          ${(canManage || isMine) ? `
            <div class="admin-actions">
              ${canManage ? `<button class="secondary setCoverBtn">${isCover ? '🖼️ 썸네일 해제' : '🖼️ 썸네일 지정'}</button>` : ''}
              ${canManage ? `<button class="ghost pinBtn">${s.pinned ? '📌 고정해제' : '📌 고정'}</button>` : ''}
              ${canManage ? `<button class="ghost hideBtn">${s.hidden ? '👁️ 공개' : '🔒 비공개'}</button>` : ''}
              ${(canManage && !isMine) ? `<button class="danger banUserBtn">${isAuthorBanned ? '🔓 차단해제' : '🚫 유저 밴'}</button>` : ''}
              <button class="danger deleteBtn">🗑️ 삭제</button>
            </div>
          ` : ''}

          <div class="comment-section">
            <div class="comment-list">
              ${comments.length === 0 ? '<div class="small" style="color:#aaa;">아직 댓글이 없습니다.</div>' : 
                comments.map(c=>{
                  const isMyComment = (c.visitor_id === myVid) || canManage;
                  return `
                    <div class="comment-item" data-cid="${c.id}">
                      <span class="c-author"><b>${escapeHtml(c.author)}</b></span>: <span class="c-content">${escapeHtml(c.content)}</span>
                      ${c.image ? `<img src="${c.image}" onclick="openModal('${c.image}', '${escapeHtml(c.author)}님의 수정 리믹스')">` : ''}
                      ${c.is_edited ? '<span class="edited-tag">(수정됨)</span>' : ''}
                      ${isMyComment ? `
                        <div style="margin-top:2px; display:flex; gap:4px; justify-content:flex-end;">
                          <button class="ghost editCommentBtn" style="font-size:9px; padding:1px 4px;">수정</button>
                          <button class="danger delCommentBtn" style="font-size:9px; padding:1px 4px;">삭제</button>
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')
              }
            </div>
            
            <div class="row" style="gap:4px;">
              <input type="text" placeholder="댓글이나 소감 입력..." class="commentInput" style="font-size:11px; padding:6px 8px; flex:1;" ${isBanned?'disabled':''}>
              <button class="commentBtn" style="padding:6px 10px; font-size:11px;" ${isBanned?'disabled':''}>등록</button>
            </div>
          </div>
        </div>
      `;
    }
    feed.innerHTML = html;

    feed.querySelectorAll('.thumb-card').forEach(card=>{
      const sid = card.dataset.sid;
      const target = subs.find(x=>x.id===sid);

      const remixBtn = card.querySelector('.remixBtn');
      if(remixBtn){
        remixBtn.onclick = ()=>{
          activeRemixTarget = { subId: target.id, author: target.author || '익명' };
          setupMultiLayerStudio(id, target.image);
          
          document.getElementById('remixTargetName').innerText = target.author || '익명';
          document.getElementById('remixBanner').style.display = 'flex';
          document.getElementById('studioTitle').innerHTML = `✨ <b>[리믹스 모드]</b> ${escapeHtml(target.author || '익명')}님의 그림 수정 중`;
          document.getElementById('submitBtn').innerText = '원작 그림의 댓글에 리믹스 등록하기';

          document.getElementById('studioArea').scrollIntoView({ behavior: 'smooth' });
        };
      }

      card.querySelector('.like-btn').onclick = async ()=>{
        target.likedBy = target.likedBy || [];
        if(target.likedBy.includes(myVid)){
          target.likedBy = target.likedBy.filter(v=>v!==myVid);
          target.likes = Math.max(0, (target.likes||0) - 1);
        } else {
          target.likedBy.push(myVid);
          target.likes = (target.likes||0) + 1;
        }
        await updateSub(target);
        refreshFeed();
      };

      const banBtn = card.querySelector('.banUserBtn');
      if(banBtn){
        banBtn.onclick = async ()=>{
          const targetVid = target.visitor_id;
          let bannedList = gallery.banned_visitors || [];
          if(bannedList.includes(targetVid)){
            bannedList = bannedList.filter(v => v !== targetVid);
          } else {
            if(!confirm(`${target.author || '익명'} 님을 차단하시겠습니까?`)) return;
            bannedList.push(targetVid);
          }
          gallery.banned_visitors = bannedList;
          await saveGallery(id, gallery);
          renderVisitor(id, currentKey);
        };
      }

      const setCoverBtn = card.querySelector('.setCoverBtn');
      if(setCoverBtn){
        setCoverBtn.onclick = async ()=>{
          gallery.cover_image = (gallery.cover_image === target.image) ? '' : target.image;
          const ok = await saveGallery(id, gallery);
          if(ok) refreshFeed();
        };
      }

      const delBtn = card.querySelector('.deleteBtn');
      if(delBtn){
        delBtn.onclick = async ()=>{
          if(confirm('이 그림을 삭제하시겠습니까?')){ await deleteSub(sid); refreshFeed(); }
        };
      }

      const pinBtn = card.querySelector('.pinBtn');
      if(pinBtn){
        pinBtn.onclick = async ()=>{
          target.pinned = !target.pinned; await updateSub(target); refreshFeed();
        };
      }

      const hideBtn = card.querySelector('.hideBtn');
      if(hideBtn){
        hideBtn.onclick = async ()=>{
          target.hidden = !target.hidden; await updateSub(target); refreshFeed();
        };
      }

      const commentBtn = card.querySelector('.commentBtn');
      if(commentBtn){
        commentBtn.onclick = async ()=>{
          const input = card.querySelector('.commentInput');
          const val = input.value.trim();
          const author = localStorage.getItem('visitor-nickname') || '익명';
          if(!val) return;

          await addComment(sid, author, val, null);
          input.value = '';
          refreshFeed();
        };
      }

      card.querySelectorAll('.comment-item').forEach(cItem=>{
        const cid = cItem.dataset.cid;
        const editBtn = cItem.querySelector('.editCommentBtn');
        if(editBtn){
          editBtn.onclick = async ()=>{
            const currentContent = cItem.querySelector('.c-content').innerText;
            const updated = prompt('댓글을 수정하세요:', currentContent);
            if(updated !== null && updated.trim() !== '' && updated !== currentContent){
              const ok = await updateComment(cid, updated.trim());
              if(ok) refreshFeed();
            }
          };
        }

        const delCBtn = cItem.querySelector('.delCommentBtn');
        if(delCBtn){
          delCBtn.onclick = async ()=>{
            if(confirm('이 댓글을 삭제하시겠습니까?')){
              const ok = await deleteComment(cid);
              if(ok) refreshFeed();
            }
          };
        }
      });
    });
  }

  refreshFeed();
  pollTimer = setInterval(refreshFeed, 4000);
}

route();
</script>
</body>
</html>
