function getRgbaColor(hex, opacity){
  let c = hex.replace('#','');
  if(c.length === 3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c, 16);
  return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${opacity})`;
}

// ---------------- API ----------------
async function loadGallery(id){
  try {
    const { data, error } = await supabaseClient.from('gallery').select('*').eq('id', id).maybeSingle();
    if(error || !data) return null;
    return { ...data, banned_visitors: data.banned_visitors || [] };
  } catch(e){ return null; }
}

async function saveGallery(id, obj){
  try {
    const { data, error } = await supabaseClient.from('gallery').upsert({
      id: id,
      owner_key: obj.owner_key,
      title: obj.title || '나만의 갤러리',
      is_public: obj.is_public !== undefined ? obj.is_public : true,
      cover_image: obj.cover_image || '',
      topic: obj.topic || '',
      banned_visitors: obj.banned_visitors || []
    }, { onConflict: 'id' }).select();
    
    if(error) { console.error(error); return false; }
    return true;
  } catch(e){ console.error(e); return false; }
}

async function deleteGallery(id){
  try {
    await supabaseClient.from('submissions').delete().eq('gallery_id', id);
    const { error } = await supabaseClient.from('gallery').delete().eq('id', id);
    return !error;
  } catch(e){ return false; }
}

async function loadPublicGalleries(query=''){
  try {
    let q = supabaseClient.from('gallery').select('*').eq('is_public', true);
    if(query) q = q.ilike('title', `%${query}%`);
    const { data, error } = await q;
    if(error) return [];
    return data;
  } catch(e){ return []; }
}

function getCoverImage(gallery, subs){
  if(gallery.cover_image) return gallery.cover_image;
  const visibleSubs = subs.filter(s=>!s.hidden);
  if(visibleSubs.length === 0) return null;
  
  const sorted = visibleSubs.slice().sort((a,b)=>{
    if((b.likes||0) !== (a.likes||0)) return (b.likes||0) - (a.likes||0);
    return new Date(b.created_at) - new Date(a.created_at);
  });
  return sorted[0].image;
}

// ---------------- Canvas Logic ----------------
function saveState(canvas, galleryId){
  const ctx = canvas.getContext('2d');
  if(undoStack.length >= MAX_UNDO) undoStack.shift();
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  redoStack = [];

  if(galleryId){
    localStorage.setItem(`draft-canvas-${galleryId}`, canvas.toDataURL());
  }
}

function undo(canvas, galleryId){
  if(undoStack.length <= 1) return;
  const ctx = canvas.getContext('2d');
  redoStack.push(undoStack.pop());
  const prevState = undoStack[undoStack.length - 1];
  ctx.putImageData(prevState, 0, 0);
  if(galleryId) localStorage.setItem(`draft-canvas-${galleryId}`, canvas.toDataURL());
}

function redo(canvas, galleryId){
  if(redoStack.length === 0) return;
  const ctx = canvas.getContext('2d');
  const nextState = redoStack.pop();
  undoStack.push(nextState);
  ctx.putImageData(nextState, 0, 0);
  if(galleryId) localStorage.setItem(`draft-canvas-${galleryId}`, canvas.toDataURL());
}

function floodFill(canvas, startX, startY, fillColorRgba){
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  
  const temp = document.createElement('div');
  temp.style.color = fillColorRgba;
  document.body.appendChild(temp);
  const cs = window.getComputedStyle(temp).color.match(/[\d.]+/g).map(Number);
  document.body.removeChild(temp);
  
  const fillR = cs[0], fillG = cs[1], fillB = cs[2], fillA = Math.round((cs[3] !== undefined ? cs[3] : 1) * 255);
  const targetIdx = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
  const startR = data[targetIdx], startG = data[targetIdx+1], startB = data[targetIdx+2], startA = data[targetIdx+3];

  if(Math.abs(startR - fillR) < 5 && Math.abs(startG - fillG) < 5 && Math.abs(startB - fillB) < 5 && Math.abs(startA - fillA) < 5) return;

  function matchColor(idx){
    return Math.abs(data[idx] - startR) < 32 && Math.abs(data[idx+1] - startG) < 32 &&
           Math.abs(data[idx+2] - startB) < 32 && Math.abs(data[idx+3] - startA) < 32;
  }

  const queue = [[Math.floor(startX), Math.floor(startY)]];
  const width = canvas.width, height = canvas.height;

  while(queue.length > 0){
    const [x, y] = queue.pop();
    const idx = (y * width + x) * 4;
    if(matchColor(idx)){
      data[idx] = fillR; data[idx+1] = fillG; data[idx+2] = fillB; data[idx+3] = fillA;
      if(x > 0) queue.push([x - 1, y]);
      if(x < width - 1) queue.push([x + 1, y]);
      if(y > 0) queue.push([x, y - 1]);
      if(y < height - 1) queue.push([x, y + 1]);
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function setupCanvas(canvas, galleryId){
  const ctx = canvas.getContext('2d');
  canvas.width = 480; canvas.height = 360;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  
  undoStack = []; redoStack = [];

  const savedDraft = localStorage.getItem(`draft-canvas-${galleryId}`);
  if(savedDraft){
    const img = new Image();
    img.onload = ()=>{
      ctx.drawImage(img, 0, 0);
      saveState(canvas, galleryId);
    };
    img.src = savedDraft;
  } else {
    saveState(canvas, galleryId);
  }

  let last = null;
  let isFramePending = false;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    return { 
      x: (e.clientX - rect.left) * (canvas.width / rect.width), 
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function start(e){
    e.preventDefault();
    const p = pos(e);
    const activeColor = getRgbaColor(currentBrush.color, currentBrush.opacity);

    if(currentBrush.tool === 'fill'){
      floodFill(canvas, p.x, p.y, activeColor);
      saveState(canvas, galleryId);
      return;
    }
    drawing = true; last = p;
  }

  function move(e){
    if(!drawing || currentBrush.tool === 'fill') return; 
    e.preventDefault();
    const p = pos(e);

    if(!isFramePending){
      isFramePending = true;
      requestAnimationFrame(()=>{
        ctx.strokeStyle = getRgbaColor(currentBrush.color, currentBrush.opacity);
        let calculatedWidth = currentBrush.size;
        if (e.pointerType === 'pen' && e.pressure > 0) calculatedWidth = currentBrush.size * (e.pressure * 2); 
        ctx.lineWidth = Math.max(0.5, calculatedWidth);

        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p; isFramePending = false;
      });
    }
  }

  function end(){
    if(drawing){ drawing = false; saveState(canvas, galleryId); }
  }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  return ctx;
}

function clearCanvas(canvas, galleryId){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(galleryId) localStorage.removeItem(`draft-canvas-${galleryId}`);
  saveState(canvas, galleryId);
}

      <div style="border-left:1px solid #ccc; height:16px; margin:0 4px;"></div>
      <span class="small">투명도:</span>
      <input type="range" min="5" max="100" value="100" id="brushOpacity" style="width:70px;">
      <span class="small" id="brushOpacityVal">100%</span>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="ghost" id="undoBtn" type="button" style="padding:4px 10px; font-size:12px;">↩️ 뒤로</button>
      <button class="ghost" id="redoBtn" type="button" style="padding:4px 10px; font-size:12px;">↪️ 다시</button>
      <button class="ghost" id="clearBtn" type="button" style="padding:4px 10px; font-size:12px; color:var(--bad);">🗑️ 초기화</button>
    </div>`;
}

function bindBrushControls(scope, galleryId){
  const canvas = scope.querySelector('canvas');
  scope.querySelectorAll('.swatch').forEach(s=>{
    s.onclick = ()=>{ 
      currentBrush.color = s.dataset.color; 
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active')); 
      s.classList.add('active'); 
    };
  });

  const customColor = scope.querySelector('#customColor');
  if(customColor){
    customColor.onchange = (e)=>{
      currentBrush.color = e.target.value;
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
    };
  }

  const tBrush = scope.querySelector('#toolBrush');
  const tFill = scope.querySelector('#toolFill');
  if(tBrush && tFill){
    tBrush.onclick = ()=>{ currentBrush.tool='brush'; tBrush.classList.add('active'); tFill.classList.remove('active'); };
    tFill.onclick = ()=>{ currentBrush.tool='fill'; tFill.classList.add('active'); tBrush.classList.remove('active'); };
  }

  scope.querySelector('#brushSize').oninput = (e)=>{ 
    currentBrush.size = parseInt(e.target.value); 
    scope.querySelector('#brushSizeVal').textContent = `${currentBrush.size}px`;
  };

  scope.querySelector('#brushOpacity').oninput = (e)=>{
    const val = parseInt(e.target.value);
    currentBrush.opacity = val / 100;
    scope.querySelector('#brushOpacityVal').textContent = `${val}%`;
  };

  scope.querySelector('#undoBtn').onclick = ()=> undo(canvas, galleryId);
  scope.querySelector('#redoBtn').onclick = ()=> redo(canvas, galleryId);
  scope.querySelector('#clearBtn').onclick = ()=> clearCanvas(canvas, galleryId);
}

// ---------------- Admin View ----------------
async function renderOwner(id, key){
  const gallery = await loadGallery(id);
  if(!gallery || gallery.owner_key !== key){
    APP.innerHTML = `<div class="card">접근 권한이 없습니다. <a class="home-link" href="#">홈으로</a></div>`;
    return;
  }

  let currentSort = 'popular';
  const visitLink = baseUrl() + '#visit=' + id;
  const ownerLink = baseUrl() + `#owner=${id}&key=${key}`;

  APP.innerHTML = `
    <div class="topbar">
      <h1>🖼️ 갤러리 관리자 페이지</h1>
      <a class="home-link" href="#">홈으로</a>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <h2 style="margin:0;">⚙️ 갤러리 설정</h2>
        <button class="danger" id="deleteGalleryBtn" style="padding:4px 10px; font-size:12px;">🚨 갤러리 삭제</button>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <input type="text" id="galleryTitle" value="${escapeHtml(gallery.title)}" placeholder="갤러리 이름" style="flex:1;">
        <select id="galleryPublic">
          <option value="true" ${gallery.is_public?'selected':''}>🌐 공개</option>
          <option value="false" ${!gallery.is_public?'selected':''}>🔒 비공개</option>
        </select>
        <button id="saveSettingBtn">저장</button>
      </div>
      <div class="small">🔒 비밀 관리자 링크 (공개 금지)</div>
      <div class="link-box"><input type="text" readonly value="${ownerLink}"></div>
      <div class="small" style="margin-top:6px;">📎 방문자 공유 링크</div>
      <div class="link-box"><input type="text" readonly value="${visitLink}"><button class="secondary" id="copyBtn">복사</button></div>
    </div>

    <div class="row" style="justify-content:space-between; margin:16px 0 8px;">
      <h2>방문자들의 작품 관리</h2>
      <select id="sortSelect">
        <option value="popular">🔥 인기순</option>
        <option value="newest">✨ 최신순</option>
        <option value="oldest">⏳ 오래된순</option>
      </select>
    </div>

    <div id="subFeed" class="grid"><span class="small">불러오는 중...</span></div>

    <div class="card" style="margin-top:20px;">
      <h2>🚫 차단된 유저 (밴 목록)</h2>
      <div id="bannedList" class="small">차단된 유저가 없습니다.</div>
    </div>
  `;

  document.getElementById('copyBtn').onclick = ()=>{
    navigator.clipboard.writeText(visitLink).then(()=>alert('방문자 링크가 복사되었습니다!'));
  };

  document.getElementById('saveSettingBtn').onclick = async ()=>{
    gallery.title = document.getElementById('galleryTitle').value.trim() || '나만의 갤러리';
    gallery.is_public = document.getElementById('galleryPublic').value === 'true';
    await saveGallery(id, gallery);
    alert('설정이 저장되었습니다.');
  };

  document.getElementById('deleteGalleryBtn').onclick = async ()=>{
    if(confirm('정말로 이 갤러리와 모든 그림을 삭제하시겠습니까? 이 작업은 복구할 수 없습니다.')){
      await deleteGallery(id);
      localStorage.removeItem('my-gallery-id');
      localStorage.removeItem('my-gallery-key');
      alert('갤러리가 삭제되었습니다.');
      location.hash = '';
    }
  };

  document.getElementById('sortSelect').onchange = (e)=>{
    currentSort = e.target.value;
    refreshFeed();
  };

  async function refreshFeed(){
    if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

    const freshGallery = await loadGallery(id);
    const bannedArr = freshGallery ? (freshGallery.banned_visitors || []) : [];
    
    const bannedBox = document.getElementById('bannedList');
    if(bannedBox){
      if(bannedArr.length === 0) bannedBox.innerHTML = '<span class="small">차단된 유저가 없습니다.</span>';
      else {
        bannedBox.innerHTML = bannedArr.map(vid=>`
          <div class="row" style="margin-bottom:4px; justify-content:space-between; background:#fff0f5; padding:4px 8px; border-radius:6px;">
            <span>🚫 ID: ${vid.slice(0,8)}...</span>
            <button class="ghost unbanBtn" data-vid="${vid}" style="font-size:11px; padding:2px 6px;">차단 해제</button>
          </div>
        `).join('');
        bannedBox.querySelectorAll('.unbanBtn').forEach(btn=>{
          btn.onclick = async ()=>{
            freshGallery.banned_visitors = freshGallery.banned_visitors.filter(x=>x!==btn.dataset.vid);
            await saveGallery(id, freshGallery);
            refreshFeed();
          };
        });
      }
    }

    let subs = await loadSubs(id);
    const feed = document.getElementById('subFeed');
    if(!feed) return;
    if(subs.length === 0){ feed.innerHTML = '<span class="small">아직 업로드된 그림이 없습니다.</span>'; return; }

    subs.sort((a,b)=>{
      if(b.pinned !== a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
      if(currentSort === 'popular') return (b.likes||0) - (a.likes||0);
      if(currentSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
      if(currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
    });

    let html = '';
    for(const s of subs){
      const isBanned = bannedArr.includes(s.visitor_id);
      const isCover = freshGallery.cover_image === s.image;
      const comments = await loadComments(s.id);

      html += `
        <div class="thumb-card ${s.pinned ? 'pinned-card' : ''}" data-sid="${s.id}" data-vid="${s.visitor_id}">
          <span class="author">👤 ${escapeHtml(s.author || '익명')}</span>
          ${s.pinned ? '<span class="badge pinned">📌 고정됨</span>' : ''}
          ${s.hidden ? '<span class="badge hidden">🔒 비공개</span>' : ''}
          ${isCover ? '<span class="badge public">🖼️ 대표 이미지</span>' : ''}
          ${isBanned ? '<span class="badge private">🚫 밴됨</span>' : ''}
          <img src="${s.image}" onclick="openModal('${s.image}', '${escapeHtml(s.author || '익명')}님의 작품')">
          <div class="small" style="margin-top:4px;">❤️ 좋아요 ${s.likes||0}개</div>
          
          <div class="admin-actions">
            <button class="ghost setCoverBtn">${isCover ? '🖼️ 대표 해제' : '🖼️ 대표 설정'}</button>
            <button class="ghost pinBtn">${s.pinned ? '📌 고정 해제' : '📌 고정'}</button>
            <button class="ghost hideBtn">${s.hidden ? '👁️ 공개' : '🔒 비공개'}</button>
            <button class="danger deleteBtn">🗑️ 삭제</button>
            ${!isBanned ? `<button class="danger banBtn" style="background:#444;">🚫 밴</button>` : ''}
          </div>

          <div class="comment-section">
            <div class="comment-list">
              ${comments.length === 0 ? '<div class="small" style="color:#aaa;">댓글이 없습니다.</div>' : 
                comments.map(c=>`<div class="comment-item"><span class="c-author">${escapeHtml(c.author)}:</span> ${escapeHtml(c.content)}</div>`).join('')
              }
            </div>
          </div>
        </div>
      `;
    }
    feed.innerHTML = html;

    feed.querySelectorAll('.thumb-card').forEach(card=>{
      const sid = card.dataset.sid;
      const vid = card.dataset.vid;

      card.querySelector('.setCoverBtn').onclick = async ()=>{
        const target = subs.find(x=>x.id===sid);
        freshGallery.cover_image = (freshGallery.cover_image === target.image) ? '' : target.image;
        await saveGallery(id, freshGallery);
        refreshFeed();
      };
      card.querySelector('.pinBtn').onclick = async ()=>{
        const target = subs.find(x=>x.id===sid);
        target.pinned = !target.pinned; await updateSub(target); refreshFeed();
      };
      card.querySelector('.hideBtn').onclick = async ()=>{
        const target = subs.find(x=>x.id===sid);
        target.hidden = !target.hidden; await updateSub(target); refreshFeed();
      };
      card.querySelector('.deleteBtn').onclick = async ()=>{
        if(confirm('이 그림을 삭제하시겠습니까?')) { await deleteSub(sid); refreshFeed(); }
      };
      const banBtn = card.querySelector('.banBtn');
      if(banBtn){
        banBtn.onclick = async ()=>{
          if(confirm('이 유저를 차단하시겠습니까?')){
            freshGallery.banned_visitors.push(vid);
            await saveGallery(id, freshGallery);
            refreshFeed();
          }
        };
      }
    });
  }

  refreshFeed();
  pollTimer = setInterval(refreshFeed, 4000);
}

// ---------------- Visitor View ----------------
async function renderVisitor(id){
  const gallery = await loadGallery(id);
  if(!gallery){
    APP.innerHTML = `<div class="card">존재하지 않는 갤러리입니다. <a class="home-link" href="#">홈으로</a></div>`;
    return;
  }

  const myVid = await getVisitorId();
  const savedName = localStorage.getItem('visitor-nickname') || '';
  const isBanned = (gallery.banned_visitors || []).includes(myVid);
  let currentSort = 'popular';

  APP.innerHTML = `
    <div class="topbar">
      <h1>🎨 ${escapeHtml(gallery.title)}</h1>
      <a class="home-link" href="#">내 갤러리 만들기</a>
    </div>

    ${isBanned ? `
      <div class="card" style="background:#ffdce0; border-color:var(--bad);">
        <h2 style="color:var(--bad); margin:0;">🚫 갤러리 이용이 제한되었습니다.</h2>
        <p class="small" style="color:#555; margin-top:6px;">관리자에 의해 차단(밴)되어 그림 제출 및 댓글 생성이 안 됩니다.</p>
      </div>
    ` : `
      <div class="card">
        <h2>✏️ 캔버스에 그림 그리기</h2>
        <div class="row" style="margin-bottom:8px;">
          <input type="text" id="authorName" placeholder="내 닉네임 (선택사항)" value="${escapeHtml(savedName)}">
        </div>
        <canvas id="draw"></canvas>
        ${brushControlsHtml()}
        <div class="row" style="margin-top:10px;">
          <button id="submitBtn">작품 등록하기</button>
        </div>
        <div class="msg" id="submitMsg"></div>
      </div>
    `}

    <div class="row" style="justify-content:space-between; margin:16px 0 8px;">
      <h2>작품 목록</h2>
      <select id="sortSelect">
        <option value="popular">🔥 인기순</option>
        <option value="newest">✨ 최신순</option>
        <option value="oldest">⏳ 오래된순</option>
      </select>
    </div>

    <div id="subFeed" class="grid"><span class="small">불러오는 중...</span></div>
  `;

  if(!isBanned){
    const canvas = document.getElementById('draw');
    setupCanvas(canvas, id);
    bindBrushControls(document, id);

    document.getElementById('submitBtn').onclick = async ()=>{
      const msg = document.getElementById('submitMsg');
      msg.textContent = ''; 

      const lastSubTime = localStorage.getItem('last-sub-time');
      const now = Date.now();
      if(lastSubTime && (now - parseInt(lastSubTime)) < 30000){
        msg.textContent = `도배 방지: ${Math.ceil((30000 - (now - parseInt(lastSubTime))) / 1000)}초 후 다시 시도해주세요.`;
        msg.className = 'msg no'; return;
      }

      const fresh = await loadGallery(id);
      if((fresh.banned_visitors||[]).includes(myVid)){ alert('차단된 계정입니다.'); location.reload(); return; }

      const image = canvas.toDataURL('image/jpeg', 0.7);
      const author = document.getElementById('authorName').value.trim() || '익명';
      localStorage.setItem('visitor-nickname', author);

      await addSub(id, { id: genId(10), author, image });
      localStorage.setItem('last-sub-time', Date.now().toString());
      localStorage.removeItem(`draft-canvas-${id}`);
      
      clearCanvas(canvas, id);
      msg.textContent = '그림 제출 완료! 🎉'; msg.className='msg ok';
      refreshFeed();
    };
  }

  document.getElementById('sortSelect').onchange = (e)=>{
    currentSort = e.target.value;
    refreshFeed();
  };

  async function refreshFeed(){
    if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

    let subs = await loadSubs(id);
    subs = subs.filter(s=>!s.hidden);

    const feed = document.getElementById('subFeed');
    if(!feed) return;
    if(subs.length === 0){ feed.innerHTML = '<span class="small">아직 등록된 그림이 없습니다. 첫 그림을 그려보세요!</span>'; return; }

    subs.sort((a,b)=>{
      if(b.pinned !== a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
      if(currentSort === 'popular') return (b.likes||0) - (a.likes||0);
      if(currentSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
      if(currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
    });

    let html = '';
    for(const s of subs){
      const isMine = s.visitor_id === myVid;
      const comments = await loadComments(s.id);

      html += `
        <div class="thumb-card ${s.pinned ? 'pinned-card' : ''}" data-sid="${s.id}">
          <span class="author">👤 ${escapeHtml(s.author || '익명')} ${isMine?'(나)':''}</span>
          ${s.pinned ? '<span class="badge pinned">📌 고정됨</span>' : ''}
          <img src="${s.image}" onclick="openModal('${s.image}', '${escapeHtml(s.author || '익명')}님의 작품')">
          <button class="like-btn" data-sid="${s.id}">🤍 좋아요 (${s.likes||0})</button>
          
          ${isMine ? `<div class="admin-actions"><button class="danger myDeleteBtn">🗑️ 삭제</button></div>` : ''}

          <div class="comment-section">
            <div class="comment-list">
              ${comments.length === 0 ? '<div class="small" style="color:#aaa;">첫 댓글을 달아보세요!</div>' : 
                comments.map(c=>`<div class="comment-item"><span class="c-author">${escapeHtml(c.author)}:</span> ${escapeHtml(c.content)}</div>`).join('')
              }
            </div>
            ${!isBanned ? `
              <div class="row" style="gap:4px;">
                <input type="text" placeholder="댓글 입력..." class="commentInput" style="font-size:11px; padding:4px 6px; flex:1;">
                <button class="commentBtn" style="padding:4px 8px; font-size:11px;">작성</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }
    feed.innerHTML = html;

    feed.querySelectorAll('.thumb-card').forEach(card=>{
      const sid = card.dataset.sid;

      const myDelBtn = card.querySelector('.myDeleteBtn');
      if(myDelBtn){
        myDelBtn.onclick = async ()=>{
          if(confirm('내가 그린 그림을 삭제할까요?')){ await deleteSub(sid); refreshFeed(); }
        };
      }

      card.querySelector('.like-btn').onclick = async ()=>{
        const target = subs.find(x=>x.id===sid);
        if(!target) return;
        target.likedBy = target.likedBy || [];
        if(target.likedBy.includes(myVid)) return;
        target.likedBy.push(myVid);
        target.likes = (target.likes||0)+1;
        await updateSub(target);
        refreshFeed();
      };

      const commentBtn = card.querySelector('.commentBtn');
      if(commentBtn){
        commentBtn.onclick = async ()=>{
          const input = card.querySelector('.commentInput');
          const val = input.value.trim();
          if(!val) return;
          const author = localStorage.getItem('visitor-nickname') || '익명';
          await addComment(sid, author, val);
          input.value = '';
          refreshFeed();
        };
      }
    });
  }

  refreshFeed();
  pollTimer = setInterval(refreshFeed, 4000);
}

route();
</script>
