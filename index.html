function getRgbaColor(hex, opacity){
  let c = hex.replace('#','');
  if(c.length === 3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c, 16);
  const r = (num >> 16) & 255;
  const g = (num >> 8) & 255;
  const b = num & 255;
  return `rgba(${r}, ${g}, ${b}, ${opacity})`;
}

// ---------------- 고성능 최적화 캔버스 엔진 ----------------
function saveState(canvas){
  const ctx = canvas.getContext('2d');
  if(undoStack.length >= MAX_UNDO) undoStack.shift(); // 메모리 상한 초과 방지
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  redoStack = []; // 새 획을 그리면 redo 초기화
}

function undo(canvas){
  if(undoStack.length <= 1) return; // 초기 백그라운드 보존
  const ctx = canvas.getContext('2d');
  redoStack.push(undoStack.pop());
  const prevState = undoStack[undoStack.length - 1];
  ctx.putImageData(prevState, 0, 0);
}

function redo(canvas){
  if(redoStack.length === 0) return;
  const ctx = canvas.getContext('2d');
  const nextState = redoStack.pop();
  undoStack.push(nextState);
  ctx.putImageData(nextState, 0, 0);
}

function floodFill(canvas, startX, startY, fillColorRgba){
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  
  const temp = document.createElement('div');
  temp.style.color = fillColorRgba;
  document.body.appendChild(temp);
  const cs = window.getComputedStyle(temp).color.match(/[\d.]+/g).map(Number);
  document.body.removeChild(temp);
  
  const fillR = cs[0], fillG = cs[1], fillB = cs[2], fillA = Math.round((cs[3] !== undefined ? cs[3] : 1) * 255);

  const targetIdx = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
  const startR = data[targetIdx], startG = data[targetIdx+1], startB = data[targetIdx+2], startA = data[targetIdx+3];

  if(Math.abs(startR - fillR) < 5 && Math.abs(startG - fillG) < 5 && Math.abs(startB - fillB) < 5 && Math.abs(startA - fillA) < 5) return;

  function matchColor(idx){
    return Math.abs(data[idx] - startR) < 32 &&
           Math.abs(data[idx+1] - startG) < 32 &&
           Math.abs(data[idx+2] - startB) < 32 &&
           Math.abs(data[idx+3] - startA) < 32;
  }

  const queue = [[Math.floor(startX), Math.floor(startY)]];
  const width = canvas.width;
  const height = canvas.height;

  while(queue.length > 0){
    const [x, y] = queue.pop();
    const idx = (y * width + x) * 4;

    if(matchColor(idx)){
      data[idx] = fillR;
      data[idx+1] = fillG;
      data[idx+2] = fillB;
      data[idx+3] = fillA;

      if(x > 0) queue.push([x - 1, y]);
      if(x < width - 1) queue.push([x + 1, y]);
      if(y > 0) queue.push([x, y - 1]);
      if(y < height - 1) queue.push([x, y + 1]);
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function setupCanvas(canvas){
  const ctx = canvas.getContext('2d');
  canvas.width = 480; canvas.height = 360;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  
  undoStack = []; redoStack = [];
  saveState(canvas); // 최초 하얀 백그라운드 저장

  let last = null;
  let isRequestingFrame = false;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { 
      x: (e.clientX - rect.left) * scaleX, 
      y: (e.clientY - rect.top) * scaleY,
      pressure: (e.pressure && e.pressure > 0 && e.pointerType === 'pen') ? e.pressure : 0.5
    };
  }

  function start(e){
    e.preventDefault();
    const p = pos(e);
    const activeColor = getRgbaColor(currentBrush.color, currentBrush.opacity);

    if(currentBrush.tool === 'fill'){
      floodFill(canvas, p.x, p.y, activeColor);
      saveState(canvas);
      return;
    }

    drawing = true;
    last = p;
  }

  function move(e){
    if(!drawing || currentBrush.tool === 'fill') return; 
    e.preventDefault();
    const p = pos(e);

    // RequestAnimationFrame으로 브라우저 렌더링 주기에 동기화 (프레임 튕김 완벽 방지)
    if(!isRequestingFrame){
      isRequestingFrame = true;
      requestAnimationFrame(()=>{
        const activeColor = getRgbaColor(currentBrush.color, currentBrush.opacity);
        ctx.strokeStyle = activeColor;
        
        let calculatedWidth = currentBrush.size;
        if (e.pointerType === 'pen' && e.pressure > 0) {
          calculatedWidth = currentBrush.size * (e.pressure * 2); 
        }
        ctx.lineWidth = Math.max(0.5, calculatedWidth);

        ctx.beginPath(); 
        ctx.moveTo(last.x, last.y); 
        ctx.lineTo(p.x, p.y); 
        ctx.stroke();
        
        last = p;
        isRequestingFrame = false;
      });
    }
  }

  function end(){ 
    if(drawing){
      drawing = false; 
      saveState(canvas); // 획 작성이 끝난 직후 1회만 상태 저장
    }
  }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  window.onkeydown = (e)=>{
    if(e.ctrlKey || e.metaKey){
      if(e.key.toLowerCase() === 'z'){
        if(e.shiftKey) redo(canvas); else undo(canvas);
      } else if(e.key.toLowerCase() === 'y'){
        redo(canvas);
      }
    }
  };
  return ctx;
}

function clearCanvas(canvas){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  saveState(canvas);
}

function bindBrushControls(scope){
  const canvas = scope.querySelector('canvas');
  scope.querySelectorAll('.swatch').forEach(s=>{
    s.onclick = ()=>{ 
      currentBrush.color = s.dataset.color; 
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active')); 
      s.classList.add('active'); 
    };
  });

  const customColor = scope.querySelector('#customColor');
  if(customColor){
    customColor.onchange = (e)=>{
      currentBrush.color = e.target.value;
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
    };
  }

  const tBrush = scope.querySelector('#toolBrush');
  const tFill = scope.querySelector('#toolFill');
  if(tBrush && tFill){
    tBrush.onclick = ()=>{ currentBrush.tool='brush'; tBrush.classList.add('active'); tFill.classList.remove('active'); };
    tFill.onclick = ()=>{ currentBrush.tool='fill'; tFill.classList.add('active'); tBrush.classList.remove('active'); };
  }

  const bSize = scope.querySelector('#brushSize');
  const bSizeVal = scope.querySelector('#brushSizeVal');
  bSize.oninput = (e)=>{ 
    currentBrush.size = parseInt(e.target.value); 
    bSizeVal.textContent = `${currentBrush.size}px`;
  };

  const bOpacity = scope.querySelector('#brushOpacity');
  const bOpacityVal = scope.querySelector('#brushOpacityVal');
  bOpacity.oninput = (e)=>{
    const val = parseInt(e.target.value);
    currentBrush.opacity = val / 100;
    bOpacityVal.textContent = `${val}%`;
  };

  scope.querySelector('#undoBtn').onclick = ()=> undo(canvas);
  scope.querySelector('#redoBtn').onclick = ()=> redo(canvas);
  scope.querySelector('#clearBtn').onclick = ()=> clearCanvas(canvas);
}

  const gallery = await loadGallery(id);
  if(!gallery || gallery.owner_key !== key){
    APP.innerHTML = `<div class="card">접근 권한이 없거나 존재하지 않는 관리자 링크입니다. <a class="home-link" href="#">홈으로</a></div>`;
    return;
  }

  const visitLink = baseUrl() + '#visit=' + id;
  const ownerLink = baseUrl() + `#owner=${id}&key=${key}`;
  
  APP.innerHTML = `
    <div class="topbar"><h1>🖼️ 내 갤러리 관리</h1><a class="home-link" href="#">홈</a></div>
    <div class="card">
      <div class="small">🔒 주인 비밀 관리자 링크 (절대 공유 금지)</div>
      <div class="link-box"><input type="text" readonly value="${ownerLink}"></div>
      <div class="small" style="margin-top:10px;">📎 방문자 공유 링크</div>
      <div class="link-box"><input type="text" readonly value="${visitLink}"><button class="secondary" id="copyBtn">복사</button></div>
    </div>
    <div class="card">
      <h2>모드 선택</h2>
      <div class="row">
        <button class="mode-btn ${gallery.mode==='catchmind'?'':'off'}" id="modeCatch">🕵️ 캐치마인드 모드</button>
        <button class="mode-btn ${gallery.mode==='topic'?'':'off'}" id="modeTopic">🎯 주제 모드</button>
      </div>
      <div id="topicSetter" style="margin-top:10px; ${gallery.mode==='topic'?'':'display:none;'}">
        <div class="row">
          <input type="text" id="topicInput" placeholder="오늘의 주제를 입력하세요" value="${escapeHtml(gallery.topic||'')}">
          <button id="setTopicBtn">주제 설정</button>
        </div>
        <div class="small" style="margin-top:6px;">현재 주제: <b>${gallery.topic ? escapeHtml(gallery.topic) : '(아직 없음)'}</b></div>
      </div>
    </div>
    
    <h2>${gallery.mode==='catchmind' ? '방문자들의 그림 — 주제를 맞혀보세요' : '방문자들의 작품'}</h2>
    <div id="subFeed" class="grid"><span class="small">불러오는 중...</span></div>

    <div class="card" style="margin-top:20px;">
      <h2>🚫 밴 목록 관리 (차단된 유저)</h2>
      <div id="bannedList" class="small">차단된 유저가 없습니다.</div>
    </div>
  `;

  document.getElementById('copyBtn').onclick = ()=>{
    navigator.clipboard.writeText(visitLink).then(()=>alert('방문자 링크가 복사됐어요!')).catch(()=>{});
  };
  document.getElementById('modeCatch').onclick = async ()=>{ gallery.mode='catchmind'; await saveGallery(id, gallery); renderOwner(id, key); };
  document.getElementById('modeTopic').onclick = async ()=>{ gallery.mode='topic'; await saveGallery(id, gallery); renderOwner(id, key); };
  document.getElementById('setTopicBtn').onclick = async ()=>{
    const v = document.getElementById('topicInput').value.trim();
    if(!v) return;
    gallery.topic = v; await saveGallery(id, gallery); renderOwner(id, key);
  };

  async function refreshFeed(){
    if(document.activeElement && document.activeElement.classList.contains('guessInput')) return;

    const freshGallery = await loadGallery(id);
    const bannedArr = freshGallery ? (freshGallery.banned_visitors || []) : [];
    
    const bannedBox = document.getElementById('bannedList');
    if(bannedBox){
      if(bannedArr.length === 0){
        bannedBox.innerHTML = '<span class="small">차단된 플레이어가 없습니다.</span>';
      } else {
        bannedBox.innerHTML = bannedArr.map(vid=>`
          <div class="row" style="margin-bottom:4px; justify-content:space-between; background:#fff0f5; padding:4px 8px; border-radius:6px;">
            <span>🚫 ID: ${vid.slice(0,8)}...</span>
            <button class="ghost unbanBtn" data-vid="${vid}" style="font-size:11px; padding:2px 6px;">밴 해제</button>
          </div>
        `).join('');

        bannedBox.querySelectorAll('.unbanBtn').forEach(btn=>{
          btn.onclick = async ()=>{
            const vid = btn.dataset.vid;
            freshGallery.banned_visitors = freshGallery.banned_visitors.filter(x=>x!==vid);
            await saveGallery(id, freshGallery);
            refreshFeed();
          };
        });
      }
    }

    const subs = await loadSubs(id);
    const feed = document.getElementById('subFeed');
    if(!feed) return;
    if(subs.length===0){ feed.innerHTML = '<span class="small">아직 그림이 없어요. 방문자 링크를 공유해보세요!</span>'; return; }
    
    const sortedSubs = subs.slice().sort((a,b)=>(b.pinned?1:0) - (a.pinned?1:0));

    feed.innerHTML = sortedSubs.map(s=>{
      const isBanned = bannedArr.includes(s.visitor_id);
      return `
      <div class="thumb-card ${s.pinned ? 'pinned-card' : ''}" data-sid="${s.id}" data-vid="${s.visitor_id}">
        <span class="author">👤 ${escapeHtml(s.author || '익명')}</span>
        ${s.pinned ? '<span class="badge pinned">📌 고정됨</span>' : ''}
        ${s.hidden ? '<span class="badge hidden">🔒 비공개</span>' : ''}
        ${isBanned ? '<span class="badge banned">🚫 밴됨</span>' : ''}
        <img src="${s.image}" onclick="openModal('${s.image}', '${escapeHtml(s.author || '익명')}님의 작품')">
        ${gallery.mode==='catchmind' ? (
          s.correct
            ? `<span class="badge correct">✅ 맞춤: ${escapeHtml(s.topic)}</span>`
            : `<span class="badge pending">🤔 맞히는 중</span>
               <div class="guess-row">
                 <input type="text" placeholder="정답 입력" class="guessInput" style="font-size:12px; padding:6px;">
                 <button class="guessBtn" style="padding:6px 10px; font-size:12px;">맞히기</button>
               </div>
               <div class="msg"></div>`
        ) : `<span class="small">❤️ ${s.likes||0}</span>`}
        
        <div class="admin-actions">
          <button class="ghost pinBtn">${s.pinned ? '📌 해제' : '📌 고정'}</button>
          <button class="ghost hideBtn">${s.hidden ? '👁️ 공개' : '🔒 비공개'}</button>
          <button class="danger deleteBtn">🗑️ 삭제</button>
          ${!isBanned ? `<button class="danger banBtn" style="background:#444;">🚫 밴</button>` : ''}
        </div>
      </div>
    `}).join('');

    feed.querySelectorAll('.thumb-card').forEach(card=>{
      const sid = card.dataset.sid;
      const vid = card.dataset.vid;
      
      const guessBtn = card.querySelector('.guessBtn');
      if(guessBtn){
        guessBtn.onclick = async ()=>{
          const guessVal = card.querySelector('.guessInput').value.trim();
          const msg = card.querySelector('.msg');
          if(!guessVal) return;
          const fresh = await loadSubs(id);
          const target = fresh.find(x=>x.id===sid);
          if(!target) return;
          if(target.topic.trim().toLowerCase() === guessVal.toLowerCase()){
            target.correct = true;
            await updateSub(target);
            msg.textContent = '정답이에요! 🎉'; msg.className='msg ok';
            setTimeout(refreshFeed, 600);
          } else {
            msg.textContent = '아쉬워요, 다시 시도해보세요.'; msg.className='msg no';
          }
        };
      }

      card.querySelector('.pinBtn').onclick = async ()=>{
        const fresh = await loadSubs(id);
        const target = fresh.find(x=>x.id===sid);
        if(target){ target.pinned = !target.pinned; await updateSub(target); refreshFeed(); }
      };

      card.querySelector('.hideBtn').onclick = async ()=>{
        const fresh = await loadSubs(id);
        const target = fresh.find(x=>x.id===sid);
        if(target){ target.hidden = !target.hidden; await updateSub(target); refreshFeed(); }
      };

      card.querySelector('.deleteBtn').onclick = async ()=>{
        if(!confirm('이 그림을 정말 삭제할까요?')) return;
        await deleteSub(sid);
        refreshFeed();
      };

      const banBtn = card.querySelector('.banBtn');
      if(banBtn){
        banBtn.onclick = async ()=>{
          if(!confirm('이 유저를 정말 차단(밴)하시겠습니까?\n이 유저는 더 이상 그림을 올릴 수 없게 됩니다.')) return;
          if(!freshGallery.banned_visitors.includes(vid)){
            freshGallery.banned_visitors.push(vid);
            await saveGallery(id, freshGallery);
            refreshFeed();
          }
        };
      }
    });
  }
  refreshFeed();
  pollTimer = setInterval(refreshFeed, 3000);
}

// ---------------- 방문자 화면 ----------------
async function renderVisitor(id){
  const gallery = await loadGallery(id);
  if(!gallery){
    APP.innerHTML = `<div class="card">존재하지 않는 갤러리예요. <a class="home-link" href="#">홈으로</a></div>`;
    return;
  }
  const myVid = await getVisitorId();
  const savedName = localStorage.getItem('visitor-nickname') || '';
  const isBanned = (gallery.banned_visitors || []).includes(myVid);

  APP.innerHTML = `
    <div class="topbar"><h1>🎨 익명 그림 갤러리</h1><a class="home-link" href="#">내 갤러리도 만들기</a></div>
    ${isBanned ? `
      <div class="card" style="background:#ffdce0; border-color:var(--bad);">
        <h2 style="color:var(--bad); margin:0;">🚫 갤러리 이용이 제한되었습니다.</h2>
        <p class="small" style="color:#555; margin-top:6px;">관리자에 의해 해당 갤러리에서 차단(밴) 처리되어 그림을 제출할 수 없습니다.</p>
      </div>
    ` : (gallery.mode==='catchmind' ? `
      <div class="card">
        <h2>🕵️ 캐치마인드 모드</h2>
        <p class="sub">주제를 몰래 정하고 그림을 그리면, 갤러리 주인이 맞혀볼 거예요!</p>
        <div class="row" style="margin-bottom:8px;">
          <input type="text" id="authorName" placeholder="내 닉네임 (선택사항)" value="${escapeHtml(savedName)}">
          <input type="text" id="secretTopic" placeholder="이 그림의 주제 (예: 판다)">
        </div>
        <canvas id="draw"></canvas>
        ${brushControlsHtml()}
        <div class="row" style="margin-top:10px;">
          <button id="submitBtn">제출하기</button>
        </div>
        <div class="msg" id="submitMsg"></div>
      </div>
    ` : `
      <div class="card">
        <h2>🎯 오늘의 주제: ${gallery.topic ? escapeHtml(gallery.topic) : '(아직 주인이 주제를 정하지 않았어요)'}</h2>
        <div class="row" style="margin-bottom:8px;">
          <input type="text" id="authorName" placeholder="내 닉네임 (선택사항)" value="${escapeHtml(savedName)}">
        </div>
        <canvas id="draw"></canvas>
        ${brushControlsHtml()}
        <div class="row" style="margin-top:10px;">
          <button id="submitBtn" ${gallery.topic?'':'disabled'}>제출하기</button>
        </div>
        <div class="msg" id="submitMsg"></div>
      </div>
    `)}
    <h2>다른 사람들의 그림</h2>
    <div id="subFeed" class="grid"><span class="small">불러오는 중...</span></div>
  `;

  if(!isBanned){
    const canvas = document.getElementById('draw');
    setupCanvas(canvas);
    bindBrushControls(document);

    document.getElementById('submitBtn').onclick = async ()=>{
      const msg = document.getElementById('submitMsg');
      msg.textContent=''; 

      const lastSubTime = localStorage.getItem('last-sub-time');
      const now = Date.now();
      if(lastSubTime && (now - parseInt(lastSubTime)) < 30000){
        const remain = Math.ceil((30000 - (now - parseInt(lastSubTime))) / 1000);
        msg.textContent = `도배 방지: ${remain}초 후에 다시 제출할 수 있습니다.`;
        msg.className = 'msg no';
        return;
      }

      const fresh = await loadGallery(id);
      if((fresh.banned_visitors||[]).includes(myVid)){
        alert('차단된 계정입니다.'); location.reload(); return;
      }

      const image = canvas.toDataURL('image/jpeg', 0.7);
      const author = document.getElementById('authorName').value.trim() || '익명';
      localStorage.setItem('visitor-nickname', author);

      if(fresh.mode==='catchmind'){
        const topic = document.getElementById('secretTopic').value.trim();
        if(!topic){ msg.textContent='주제를 먼저 입력해주세요.'; msg.className='msg no'; return; }
        await addSub(id, { id: genId(10), author, topic, image, correct:false, pinned:false, hidden:false });
        document.getElementById('secretTopic').value='';
      } else {
        if(!fresh.topic){ msg.textContent='아직 주제가 정해지지 않았어요.'; msg.className='msg no'; return; }
        await addSub(id, { id: genId(10), author, image, likes:0, likedBy:[], pinned:false, hidden:false });
      }
      
      localStorage.setItem('last-sub-time', Date.now().toString());
      clearCanvas(canvas);
      msg.textContent = '제출 완료! 🎉'; msg.className='msg ok';
      refreshFeed();
    };
  }

  async function refreshFeed(){
    const g2 = await loadGallery(id);
    let subs = await loadSubs(id);
    subs = subs.filter(s=>!s.hidden);

    const feed = document.getElementById('subFeed');
    if(!feed) return;
    if(subs.length===0){ feed.innerHTML = '<span class="small">아직 그림이 없어요. 첫 그림을 그려보세요!</span>'; return; }
    
    const sortedSubs = subs.slice().sort((a,b)=>(b.pinned?1:0) - (a.pinned?1:0));

    feed.innerHTML = sortedSubs.map(s=>{
      const isMine = s.visitor_id === myVid;
      return `
        <div class="thumb-card ${s.pinned ? 'pinned-card' : ''}" data-sid="${s.id}">
          <span class="author">👤 ${escapeHtml(s.author || '익명')} ${isMine?'(나)':''}</span>
          ${s.pinned ? '<span class="badge pinned">📌 고정됨</span>' : ''}
          <img src="${s.image}" onclick="openModal('${s.image}', '${escapeHtml(s.author || '익명')}님의 작품')">
          ${g2.mode==='catchmind' 
            ? (s.correct ? `<span class="badge correct">✅ 정답: ${escapeHtml(s.topic)}</span>` : `<span class="badge pending">🤔 맞히는 중</span>`)
            : `<button class="like-btn" data-sid="${s.id}">🤍 좋아요 (${s.likes||0})</button>`
          }
          ${isMine ? `<div class="admin-actions"><button class="danger myDeleteBtn">🗑️ 삭제</button></div>` : ''}
        </div>
      `;
    }).join('');

    feed.querySelectorAll('.thumb-card').forEach(card=>{
      const sid = card.dataset.sid;
      
      const myDelBtn = card.querySelector('.myDeleteBtn');
      if(myDelBtn){
        myDelBtn.onclick = async ()=>{
          if(!confirm('내가 그린 그림을 삭제할까요?')) return;
          await deleteSub(sid);
          refreshFeed();
        };
      }

      const likeBtn = card.querySelector('.like-btn');
      if(likeBtn){
        likeBtn.onclick = async ()=>{
          const freshSubs = await loadSubs(id);
          const target = freshSubs.find(x=>x.id===sid);
          if(!target) return;
          target.likedBy = target.likedBy || [];
          if(target.likedBy.includes(myVid)) return;
          target.likedBy.push(myVid);
          target.likes = (target.likes||0)+1;
          await updateSub(target);
          refreshFeed();
        };
      }
    });
  }
  refreshFeed();
  pollTimer = setInterval(refreshFeed, 3000);
}

route();
</script>
</body>
</html>
