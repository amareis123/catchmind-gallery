<style>
  :root{
    --bg:#fef6e4; --card:#ffffff; --ink:#26251f; --accent:#f582ae; --accent2:#8bd3dd;
    --line:#e6dfd3; --good:#3aa655; --bad:#d9534f;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Malgun Gothic', -apple-system, sans-serif; background: var(--bg); color: var(--ink); min-height:100vh; }
  #app { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  p.sub { color:#6b6a63; font-size: 13px; margin-top:0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; background: var(--accent); color: #fff; font-weight: 600; }
  button.secondary { background: var(--accent2); color:#1a3c40; }
  button.ghost { background: #eee; color: #444; }
  button.danger { background: var(--bad); color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=text], input[type=password], select { font-family: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
  .link-box { display:flex; gap:6px; margin-top:4px; }
  .link-box input { flex:1; background:#f6f3ea; }
  canvas { border-radius: 10px; border: 2px solid var(--line); background:#fff; touch-action: none; width:100%; max-width:480px; height:auto; display:block; cursor: crosshair; }
  .swatch { width:24px; height:24px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; display:inline-block; }
  .swatch.active { box-shadow: 0 0 0 2px var(--ink); transform: scale(1.1); }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; font-weight:700; }
  .badge.pinned { background:#ffe3ec; color:var(--accent); }
  .badge.hidden { background:#e2e2e2; color:#666; }
  .badge.private { background:#eee; color:#666; }
  .badge.public { background:#d9f3df; color:var(--good); }
  .grid { display:flex; flex-wrap:wrap; gap:12px; }
  
  .gallery-card { width: 220px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; transition:transform 0.1s; }
  .gallery-card:hover { transform:translateY(-2px); }
  .gallery-card .cover { width:100%; height:140px; border-radius:8px; background:#f6f3ea; object-fit:cover; display:flex; align-items:center; justify-content:center; color:#888; font-size:12px; }

  .thumb-card { width: 220px; background:#fbfaf5; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px; position:relative; }
  .thumb-card.pinned-card { border: 2px solid var(--accent); background:#fff0f5; }
  .thumb-card img { width:100%; border-radius:6px; display:block; margin-bottom:6px; background:#fff; cursor:pointer; }
  
  /* 좋아요 버튼 스타일 보완 */
  .like-btn { background:#fff; color:#666; border:1px solid var(--line); font-size:12px; padding:6px 10px; margin-top:4px; border-radius:6px; width:100%; font-weight:600; }
  .like-btn.liked { background:#ffe3ec; color:var(--accent); border-color:var(--accent); }

  .admin-actions { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
  .admin-actions button { font-size:10px; padding:4px 6px; border-radius:6px; }
  
  /* 댓글 영역 보완 */
  .comment-section { margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; }
  .comment-list { max-height:120px; overflow-y:auto; margin-bottom:8px; display:flex; flex-direction:column; gap:4px; }
  .comment-item { background:#fff; padding:6px 8px; border-radius:6px; font-size:11px; border:1px solid #f0ebd9; word-break:break-all; }

function escapeHtml(s){ const d = document.createElement('div'); d.innerText = s == null ? '' : String(s); return d.innerHTML; }
function genId(len){
  const chars = 'abcdefghijkmnopqrstuvwxyz23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

// ---------------- API ----------------
async function loadGallery(id){
  try {
    const { data, error } = await supabaseClient.from('gallery').select('*').eq('id', id).maybeSingle();
    if(error || !data) return null;
    return { ...data, banned_visitors: data.banned_visitors || [] };
  } catch(e){ return null; }
}

async function saveGallery(id, obj){
  try {
    const { data, error } = await supabaseClient.from('gallery').upsert({
      id: id,
      owner_key: obj.owner_key || 'master',
      title: obj.title || '나만의 갤러리',
      is_public: obj.is_public !== undefined ? obj.is_public : true,
      cover_image: obj.cover_image || '',
      topic: obj.topic || '',
      banned_visitors: obj.banned_visitors || []
    }, { onConflict: 'id' }).select();
    return !error;
  } catch(e){ return false; }
}

async function loadPublicGalleries(query=''){
  try {
    let q = supabaseClient.from('gallery').select('*').eq('is_public', true);
    if(query) q = q.ilike('title', `%${query}%`);
    const { data, error } = await q;
    return error ? [] : data;
  } catch(e){ return []; }
}

async function loadSubs(id){
  try {
    const { data, error } = await supabaseClient.from('submissions').select('*').eq('gallery_id', id).order('created_at', { ascending: false });
    if(error) return [];
    return data.map(item => ({ ...item, likedBy: item.liked_by || [] }));
  } catch(e){ return []; }
}

async function addSub(id, item){
  try {
    const vId = await getVisitorId();
    const { error } = await supabaseClient.from('submissions').insert({
      id: item.id,
      gallery_id: id,
      author: item.author,
      image: item.image,
      pinned: false,
      hidden: false,
      likes: 0,
      liked_by: [],
      visitor_id: vId
    });
    return !error;
  } catch(e){ return false; }
}

async function updateSub(item){
  try {
    const { error } = await supabaseClient.from('submissions').update({
      pinned: item.pinned,
      hidden: item.hidden,
      likes: item.likes,
      liked_by: item.likedBy
    }).eq('id', item.id);
    return !error;
  } catch(e){ return false; }
}

async function deleteSub(sid){
  try {
    await supabaseClient.from('comments').delete().eq('submission_id', sid);
    const { error } = await supabaseClient.from('submissions').delete().eq('id', sid);
    return !error;
  } catch(e){ return false; }
}

async function loadComments(subId){
  try {
    const { data, error } = await supabaseClient.from('comments').select('*').eq('submission_id', subId).order('created_at', { ascending: true });
    return error ? [] : data;
  } catch(e){ return []; }
}

async function addComment(subId, author, content){

      submission_id: subId,
      author: author || '익명',
      content: content
    });
    return !error;
  } catch(e){ return false; }
}

// ---------------- Canvas Helpers ----------------
function getRgbaColor(hex, opacity){
  let c = hex.replace('#','');
  if(c.length === 3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c, 16);
  return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${opacity})`;
}

function saveState(canvas, galleryId){
  const ctx = canvas.getContext('2d');
  if(undoStack.length >= MAX_UNDO) undoStack.shift();
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  redoStack = [];
  if(galleryId) localStorage.setItem(`draft-canvas-${galleryId}`, canvas.toDataURL());
}

function setupCanvas(canvas, galleryId){
  const ctx = canvas.getContext('2d');
  canvas.width = 480; canvas.height = 360;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  undoStack = []; redoStack = [];

  const savedDraft = localStorage.getItem(`draft-canvas-${galleryId}`);
  if(savedDraft){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0, 0); saveState(canvas, galleryId); };
    img.src = savedDraft;
  } else { saveState(canvas, galleryId); }

  let last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
  }
  function start(e){
    e.preventDefault(); drawing = true; last = pos(e);
  }
  function move(e){
    if(!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.strokeStyle = getRgbaColor(currentBrush.color, currentBrush.opacity);
    ctx.lineWidth = currentBrush.size;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  }
  function end(){ if(drawing){ drawing = false; saveState(canvas, galleryId); } }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  return ctx;
}

function brushControlsHtml(){
  const colors = ['#26251f','#d9534f','#f582ae','#f0ad4e','#3aa655','#3a8fd9','#ffffff'];
  return `
    <div class="row" style="margin-top:10px; gap:6px;">
      ${colors.map(c=>`<span class="swatch" data-color="${c}" style="background:${c}; ${c==='#ffffff'?'box-shadow:0 0 0 1px #ccc;':''}"></span>`).join('')}
    </div>
    <div class="row" style="margin-top:8px;">
      <span class="small">굵기:</span>
      <input type="range" min="1" max="50" value="4" id="brushSize" style="width:100px;">
      <button class="ghost" id="clearBtn" type="button" style="padding:4px 10px; font-size:12px; color:var(--bad); margin-left:auto;">🗑️ 초기화</button>
    </div>`;
}

function bindBrushControls(scope, galleryId){
  const canvas = scope.querySelector('canvas');
  scope.querySelectorAll('.swatch').forEach(s=>{
    s.onclick = ()=>{ 
      currentBrush.color = s.dataset.color; 
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active')); 
      s.classList.add('active'); 
    };
  });
  scope.querySelector('#brushSize').oninput = (e)=>{ currentBrush.size = parseInt(e.target.value); };
  scope.querySelector('#clearBtn').onclick = ()=>{
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    localStorage.removeItem(`draft-canvas-${galleryId}`);
    saveState(canvas, galleryId);
  };
}

async function renderVisitor(id){

  let currentSort = 'popular';

  APP.innerHTML = `
    <div class="topbar">

        <input type="text" id="authorName" placeholder="내 닉네임 (선택)" value="${escapeHtml(savedName)}">
      </div>
      <canvas id="draw"></canvas>
      ${brushControlsHtml()}

        <button id="submitBtn">작품 등록하기</button>
      </div>
      <div class="msg" id="submitMsg"></div>
    </div>

    <div class="row" style="justify-content:space-between; margin:16px 0 8px;">
      <h2>작품 목록</h2>
      <select id="sortSelect">
        <option value="popular">🔥 인기순</option>
        <option value="newest">✨ 최신순</option>
        <option value="oldest">⏳ 오래된순</option>
      </select>
    </div>

    <div id="subFeed" class="grid"><span class="small">불러오는 중...</span></div>
  `;

  const canvas = document.getElementById('draw');
  setupCanvas(canvas, id);
  bindBrushControls(document, id);

  document.getElementById('submitBtn').onclick = async ()=>{
    const msg = document.getElementById('submitMsg');
    const image = canvas.toDataURL('image/jpeg', 0.7);
    const author = document.getElementById('authorName').value.trim() || '익명';
    localStorage.setItem('visitor-nickname', author);

    await addSub(id, { id: genId(10), author, image });
    localStorage.removeItem(`draft-canvas-${id}`);
    
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    msg.textContent = '그림 제출 완료! 🎉'; msg.className='msg ok';
    refreshFeed();
  };

  document.getElementById('sortSelect').onchange = (e)=>{
    currentSort = e.target.value;
    refreshFeed();
  };

  async function refreshFeed(){
    if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

    let subs = await loadSubs(id);
    if(!isAdmin) {
      subs = subs.filter(s=>!s.hidden); // 관리자가 아니면 비공개 작품 숨김
    }

    const feed = document.getElementById('subFeed');
    if(!feed) return;
    if(subs.length === 0){ feed.innerHTML = '<span class="small">등록된 그림이 없습니다.</span>'; return; }

    subs.sort((a,b)=>{
      if(b.pinned !== a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
      if(currentSort === 'popular') return (b.likes||0) - (a.likes||0);
      if(currentSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
      if(currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
    });

    let html = '';
    for(const s of subs){
      const isMine = s.visitor_id === myVid;
      const isLiked = (s.likedBy || []).includes(myVid);
      const comments = await loadComments(s.id);

      html += `
        <div class="thumb-card ${s.pinned ? 'pinned-card' : ''}" data-sid="${s.id}">
          <span class="author">👤 ${escapeHtml(s.author || '익명')} ${isMine?'(나)':''}</span>
          ${s.pinned ? '<span class="badge pinned">📌 고정됨</span>' : ''}
          ${s.hidden ? '<span class="badge hidden">🔒 비공개</span>' : ''}
          <img src="${s.image}" onclick="openModal('${s.image}', '${escapeHtml(s.author || '익명')}님의 작품')">
          
          <!-- 좋아요 버튼 (상태에 따라 시각화) -->
          <button class="like-btn ${isLiked ? 'liked' : ''}" data-sid="${s.id}">
            ${isLiked ? '💖 좋아요 완료' : '🤍 좋아요'} (${s.likes||0})
          </button>
          
          <!-- 관리자 또는 작성자 제어 기능 -->
          ${(isAdmin || isMine) ? `
            <div class="admin-actions">
              ${isAdmin ? `<button class="ghost pinBtn">${s.pinned ? '📌 고정해제' : '📌 고정'}</button>` : ''}
              ${isAdmin ? `<button class="ghost hideBtn">${s.hidden ? '👁️ 공개' : '🔒 비공개'}</button>` : ''}
              <button class="danger deleteBtn">🗑️ 삭제</button>
            </div>
          ` : ''}

          <!-- 댓글 보기 및 작성 영역 -->
          <div class="comment-section">
            <div class="comment-list">
              ${comments.length === 0 ? '<div class="small" style="color:#aaa;">댓글이 없습니다.</div>' : 
                comments.map(c=>`
                  <div class="comment-item">
                    <span class="c-author">${escapeHtml(c.author)}</span>: ${escapeHtml(c.content)}
                  </div>
                `).join('')
              }
            </div>
            <div class="row" style="gap:4px;">
              <input type="text" placeholder="댓글 작성..." class="commentInput" style="font-size:11px; padding:4px 6px; flex:1;">
              <button class="commentBtn" style="padding:4px 8px; font-size:11px;">등록</button>
            </div>
          </div>
        </div>
      `;
    }
    feed.innerHTML = html;

    // 이벤트 바인딩
    feed.querySelectorAll('.thumb-card').forEach(card=>{
      const sid = card.dataset.sid;
      const target = subs.find(x=>x.id===sid);

      // 좋아요
      card.querySelector('.like-btn').onclick = async ()=>{
        target.likedBy = target.likedBy || [];
        if(target.likedBy.includes(myVid)){
          target.likedBy = target.likedBy.filter(v=>v!==myVid);
          target.likes = Math.max(0, (target.likes||0) - 1);
        } else {
          target.likedBy.push(myVid);
          target.likes = (target.likes||0) + 1;
        }
        await updateSub(target);
        refreshFeed();
      };

      // 삭제
      const delBtn = card.querySelector('.deleteBtn');
      if(delBtn){
        delBtn.onclick = async ()=>{
          if(confirm('이 그림을 삭제하시겠습니까?')){ await deleteSub(sid); refreshFeed(); }
        };
      }

      // 관리자 - 고정
      const pinBtn = card.querySelector('.pinBtn');
      if(pinBtn){
        pinBtn.onclick = async ()=>{
          target.pinned = !target.pinned; await updateSub(target); refreshFeed();
        };
      }

      // 관리자 - 비공개
      const hideBtn = card.querySelector('.hideBtn');
      if(hideBtn){
        hideBtn.onclick = async ()=>{
          target.hidden = !target.hidden; await updateSub(target); refreshFeed();
        };
      }

      // 댓글 등록
      const commentBtn = card.querySelector('.commentBtn');
      if(commentBtn){
        commentBtn.onclick = async ()=>{
          const input = card.querySelector('.commentInput');
          const val = input.value.trim();
          if(!val) return;
          const author = localStorage.getItem('visitor-nickname') || '익명';
          await addComment(sid, author, val);
          input.value = '';
          refreshFeed();
        };
      }
    });
  }

  refreshFeed();
  pollTimer = setInterval(refreshFeed, 4000);
}

route();
</script>
</body>
</html>
