async function loadGallery(id){
  try {
    const { data, error } = await supabaseClient.from('gallery').select('*').eq('id', id).maybeSingle();
    if(error || !data) return null;
    return { ...data, banned_visitors: data.banned_visitors || [] };
  } catch(e){ return null; }
}

async function saveGallery(id, obj){
  try {

      id: id,
      owner_key: obj.owner_key || genId(16),
      title: obj.title || '나만의 갤러리',

// ---------------- Key Bindings (Ctrl+Z, Ctrl+Y) ----------------
window.addEventListener('keydown', (e) => {
  if (!currentActiveCanvas) return;
  const activeEl = document.activeElement;
  if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;

  if (e.ctrlKey || e.metaKey) {
    if (e.key.toLowerCase() === 'z') {
      if (e.shiftKey) { redo(currentActiveCanvas, currentActiveGalleryId); } 
      else { undo(currentActiveCanvas, currentActiveGalleryId); }
      e.preventDefault();
    } else if (e.key.toLowerCase() === 'y') {
      redo(currentActiveCanvas, currentActiveGalleryId);
      e.preventDefault();
    }
  }
});

// ---------------- Cover Image Priority Calculation ----------------
function determineGalleryCover(gallery, visibleSubs){
  if(visibleSubs.length === 0) return null;

  if(gallery.cover_image && visibleSubs.some(s=>s.image === gallery.cover_image)){
    return gallery.cover_image;
  }

  const pinnedSubs = visibleSubs.filter(s => s.pinned);
  if(pinnedSubs.length > 0){
    const randomIndex = Math.floor(Math.random() * pinnedSubs.length);
    return pinnedSubs[randomIndex].image;
  }

  const maxLikes = Math.max(...visibleSubs.map(s => s.likes || 0));
  if(maxLikes > 0){
    const topLikedSubs = visibleSubs.filter(s => (s.likes || 0) === maxLikes);
    const randomIndex = Math.floor(Math.random() * topLikedSubs.length);
    return topLikedSubs[randomIndex].image;
  }

  return visibleSubs[0].image;
}

// ---------------- Canvas & Performance Optimization ----------------
function getRgbaColor(hex, opacity){
  let c = hex.replace('#','');
  if(c.length === 3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c, 16);
  return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${opacity})`;
}

function saveState(canvas, galleryId){
  const ctx = canvas.getContext('2d');
  if(undoStack.length >= MAX_UNDO) undoStack.shift();
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  redoStack = [];
  if(galleryId) {
    try { localStorage.setItem(`draft-canvas-${galleryId}`, canvas.toDataURL('image/png')); } catch(e){}
  }
}

function undo(canvas, galleryId){
  if(undoStack.length <= 1) return;
  const ctx = canvas.getContext('2d');
  redoStack.push(undoStack.pop());
  const prevState = undoStack[undoStack.length - 1];
  ctx.putImageData(prevState, 0, 0);
  if(galleryId) localStorage.setItem(`draft-canvas-${galleryId}`, canvas.toDataURL('image/png'));
}

function redo(canvas, galleryId){
  if(redoStack.length === 0) return;
  const ctx = canvas.getContext('2d');
  const nextState = redoStack.pop();
  undoStack.push(nextState);
  ctx.putImageData(nextState, 0, 0);
  if(galleryId) localStorage.setItem(`draft-canvas-${galleryId}`, canvas.toDataURL('image/png'));
}

function floodFill(canvas, startX, startY, fillColorRgba){
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  
  const temp = document.createElement('div');
  temp.style.color = fillColorRgba;
  document.body.appendChild(temp);
  const cs = window.getComputedStyle(temp).color.match(/[\d.]+/g).map(Number);
  document.body.removeChild(temp);
  
  const fillR = cs[0], fillG = cs[1], fillB = cs[2], fillA = Math.round((cs[3] !== undefined ? cs[3] : 1) * 255);
  const targetIdx = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
  const startR = data[targetIdx], startG = data[targetIdx+1], startB = data[targetIdx+2], startA = data[targetIdx+3];

  if(Math.abs(startR - fillR) < 5 && Math.abs(startG - fillG) < 5 && Math.abs(startB - fillB) < 5 && Math.abs(startA - fillA) < 5) return;

  function matchColor(idx){
    return Math.abs(data[idx] - startR) < 32 && Math.abs(data[idx+1] - startG) < 32 &&
           Math.abs(data[idx+2] - startB) < 32 && Math.abs(data[idx+3] - startA) < 32;
  }

  const queue = [[Math.floor(startX), Math.floor(startY)]];
  const width = canvas.width, height = canvas.height;

  while(queue.length > 0){
    const [x, y] = queue.pop();
    const idx = (y * width + x) * 4;
    if(matchColor(idx)){
      data[idx] = fillR; data[idx+1] = fillG; data[idx+2] = fillB; data[idx+3] = fillA;
      if(x > 0) queue.push([x - 1, y]);
      if(x < width - 1) queue.push([x + 1, y]);
      if(y > 0) queue.push([x, y - 1]);
      if(y < height - 1) queue.push([x, y + 1]);
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function setupCanvas(canvas, galleryId){
  currentActiveCanvas = canvas;
  currentActiveGalleryId = galleryId;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  canvas.width = 480; canvas.height = 360;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  undoStack = []; redoStack = [];

  const savedDraft = localStorage.getItem(`draft-canvas-${galleryId}`);
  if(savedDraft){
    const img = new Image();
    img.onload = ()=>{ 
      ctx.drawImage(img, 0, 0); 
      saveState(canvas, galleryId); 
    };
    img.src = savedDraft;
  } else { 
    ctx.fillStyle = '#ffffff'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveState(canvas, galleryId); 
  }

  let last = null;
  let isFramePending = false;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    return { 
      x: (e.clientX - rect.left) * (canvas.width / rect.width), 
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function start(e){
    e.preventDefault();
    const p = pos(e);
    const activeColor = getRgbaColor(currentBrush.color, currentBrush.opacity);

    if(currentBrush.tool === 'fill'){
      floodFill(canvas, p.x, p.y, activeColor);
      saveState(canvas, galleryId);
      return;
    }
    drawing = true; last = p;
  }

  function move(e){
    if(!drawing || currentBrush.tool === 'fill') return; 
    e.preventDefault();
    const p = pos(e);

    if(!isFramePending){
      isFramePending = true;
      requestAnimationFrame(()=>{
        ctx.strokeStyle = getRgbaColor(currentBrush.color, currentBrush.opacity);
        let calculatedWidth = currentBrush.size;
        if (e.pointerType === 'pen' && e.pressure > 0) calculatedWidth = currentBrush.size * (e.pressure * 2); 
        ctx.lineWidth = Math.max(0.5, calculatedWidth);

        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p; isFramePending = false;
      });
    }
  }

  function end(){ if(drawing){ drawing = false; saveState(canvas, galleryId); } }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  return ctx;
}

function brushControlsHtml(){
  const colors = ['#26251f','#d9534f','#f582ae','#f0ad4e','#3aa655','#3a8fd9','#8b5aa8','#ffffff'];
  return `
    <div class="row" style="margin-top:10px; gap:6px;">
      <button type="button" class="tool-btn active" id="toolBrush">🖌️ 붓</button>
      <button type="button" class="tool-btn" id="toolFill">🪣 채우기</button>
      <div style="border-left:1px solid #ccc; height:20px; margin:0 4px;"></div>
      ${colors.map(c=>`<span class="swatch ${c==='#26251f'?'active':''}" data-color="${c}" style="background:${c}; ${c==='#ffffff'?'box-shadow:0 0 0 1px #ccc;':''}"></span>`).join('')}
      <div class="color-picker-wrapper">
        <label for="customColorPicker" style="cursor:pointer; font-weight:600; color:#555;">🎨 팔레트</label>
        <input type="color" id="customColorPicker" value="#26251f">
      </div>
    </div>
    <div class="row" style="margin-top:8px;">
      <span class="small">굵기:</span>
      <input type="range" min="1" max="50" value="4" id="brushSize" style="width:70px;">
      <span class="small" id="brushSizeVal">4px</span>
      <div style="border-left:1px solid #ccc; height:16px; margin:0 4px;"></div>
      <span class="small">투명도:</span>
      <input type="range" min="5" max="100" value="100" id="brushOpacity" style="width:70px;">
      <span class="small" id="brushOpacityVal">100%</span>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="ghost" id="undoBtn" type="button" style="padding:4px 10px; font-size:12px;">↩️ 뒤로 (Ctrl+Z)</button>
      <button class="ghost" id="redoBtn" type="button" style="padding:4px 10px; font-size:12px;">↪️ 다시 (Ctrl+Y)</button>
      <button class="ghost" id="clearBtn" type="button" style="padding:4px 10px; font-size:12px; color:var(--bad);">🗑️ 초기화</button>
    </div>`;
}

function bindBrushControls(scope, galleryId){
  const canvas = scope.querySelector('canvas');
  
  scope.querySelectorAll('.swatch').forEach(s=>{
    s.onclick = ()=>{ 
      currentBrush.color = s.dataset.color; 
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active')); 
      s.classList.add('active'); 
      scope.querySelector('#customColorPicker').value = currentBrush.color.length === 7 ? currentBrush.color : '#26251f';
    };
  });

  const colorPicker = scope.querySelector('#customColorPicker');
  if(colorPicker){
    colorPicker.oninput = (e)=>{
      currentBrush.color = e.target.value;
      scope.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
    };
  }

  const tBrush = scope.querySelector('#toolBrush');
  const tFill = scope.querySelector('#toolFill');
  if(tBrush && tFill){
    tBrush.onclick = ()=>{ currentBrush.tool='brush'; tBrush.classList.add('active'); tFill.classList.remove('active'); };
    tFill.onclick = ()=>{ currentBrush.tool='fill'; tFill.classList.add('active'); tBrush.classList.remove('active'); };
  }

  scope.querySelector('#brushSize').oninput = (e)=>{ 
    currentBrush.size = parseInt(e.target.value); 
    scope.querySelector('#brushSizeVal').textContent = `${currentBrush.size}px`;
  };

  scope.querySelector('#brushOpacity').oninput = (e)=>{
    const val = parseInt(e.target.value);
    currentBrush.opacity = val / 100;
    scope.querySelector('#brushOpacityVal').textContent = `${val}%`;
  };

  scope.querySelector('#undoBtn').onclick = ()=> undo(canvas, galleryId);
  scope.querySelector('#redoBtn').onclick = ()=> redo(canvas, galleryId);
  scope.querySelector('#clearBtn').onclick = ()=>{
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    localStorage.removeItem(`draft-canvas-${galleryId}`);
    saveState(canvas, galleryId);
  };
}

// ---------------- Gallery & Admin View ----------------
async function renderVisitor(id, keyFromUrl=null){
  const gallery = await loadGallery(id);
  if(!gallery){
    APP.innerHTML = `<div class="card">존재하지 않는 갤러리입니다. <a class="home-link" href="#">홈으로</a></div>`;
    return;
  }

  const storedOwnerKey = localStorage.getItem(`owner_key_${id}`);
  const currentKey = keyFromUrl || storedOwnerKey;
  // 오너 확인: URL 키나 로컬에 저장된 키가 일치하거나, 혹은 만약 키가 없더라도 DB owner_key와 로컬스토리지 소유 정보가 맞으면 오너 권한 부여
  const isOwner = (currentKey && currentKey === gallery.owner_key) || (storedOwnerKey && storedOwnerKey === gallery.owner_key);
  const isMaster = isMasterAdmin();
  const canManage = isOwner || isMaster;

  const myVid = await getVisitorId();
  const savedName = localStorage.getItem('visitor-nickname') || '';
  let currentSort = 'popular';

  APP.innerHTML = `
    <div class="topbar">
      <h1>🎨 ${escapeHtml(gallery.title)} 
        ${isMaster ? '<span class="badge pinned">👑 마스터 모드</span>' : (isOwner ? '<span class="badge public">🔑 갤러리 소유자</span>' : '')}
      </h1>
      <a class="home-link" href="#">홈으로</a>
    </div>

    ${canManage ? `
      <div class="card" style="background:#f4f9f5; border-color:var(--good);">
        <div class="row" style="justify-content:space-between; margin-bottom:8px;">
          <h2 style="margin:0;">⚙️ 갤러리 관리 옵션</h2>
          <button class="danger" id="deleteGalleryBtn" style="padding:4px 10px; font-size:11px;">🚨 갤러리 삭제</button>
        </div>
        <div class="row" style="margin-bottom:8px;">
          <input type="text" id="galleryTitle" value="${escapeHtml(gallery.title)}" placeholder="갤러리 이름" style="flex:1;">
          <select id="galleryPublic">
            <option value="true" ${gallery.is_public?'selected':''}>🌐 공개</option>
            <option value="false" ${!gallery.is_public?'selected':''}>🔒 비공개</option>
          </select>
          <button id="saveSettingBtn">저장</button>
        </div>
      </div>
    ` : ''}

    <div class="card">
      <h2>✏️ 캔버스에 그림 그리기</h2>
      <div class="row" style="margin-bottom:8px;">
        <input type="text" id="authorName" placeholder="내 닉네임 (선택)" value="${escapeHtml(savedName)}" style="flex:1; max-width:240px;">
      </div>
      <canvas id="draw"></canvas>
      ${brushControlsHtml()}
      <div class="row" style="margin-top:10px;">
        <button id="submitBtn">작품 등록하기</button>
      </div>
      <div class="msg" id="submitMsg"></div>
    </div>

    <div class="row" style="justify-content:space-between; margin:16px 0 8px;">
      <h2>작품 목록</h2>
      <select id="sortSelect">
        <option value="popular">🔥 인기순</option>
        <option value="newest">✨ 최신순</option>
        <option value="oldest">⏳ 오래된순</option>
      </select>
    </div>

    <div id="subFeed" class="grid"><span class="small">불러오는 중...</span></div>
  `;

  // 닉네임 입력란 값 변경 시 로컬스토리지에 실시간 반영하여 댓글에서도 사용
  const authorInput = document.getElementById('authorName');
  if(authorInput){
    authorInput.oninput = (e)=>{
      localStorage.setItem('visitor-nickname', e.target.value.trim());
    };
  }

  if(canManage){
    document.getElementById('saveSettingBtn').onclick = async ()=>{
      gallery.title = document.getElementById('galleryTitle').value.trim() || '나만의 갤러리';
      gallery.is_public = document.getElementById('galleryPublic').value === 'true';
      await saveGallery(id, gallery);
      alert('갤러리 설정이 저장되었습니다.');
      renderVisitor(id, currentKey);
    };

    const delGBtn = document.getElementById('deleteGalleryBtn');
    if(delGBtn){
      delGBtn.onclick = async ()=>{
        if(confirm('이 갤러리를 완전히 삭제하시겠습니까? 등록된 작품들과 댓글이 모두 삭제됩니다.')){
          await supabaseClient.from('submissions').delete().eq('gallery_id', id);
          await supabaseClient.from('gallery').delete().eq('id', id);
          alert('갤러리가 삭제되었습니다.');
          location.hash = '';
        }
      };
    }
  }

  const canvas = document.getElementById('draw');
  setupCanvas(canvas, id);
  bindBrushControls(document, id);

  document.getElementById('submitBtn').onclick = async ()=>{
    const msg = document.getElementById('submitMsg');
    const image = canvas.toDataURL('image/jpeg', 0.7);
    const author = document.getElementById('authorName').value.trim() || '익명';
    localStorage.setItem('visitor-nickname', author);

    await addSub(id, { id: genId(10), author, image });
    localStorage.removeItem(`draft-canvas-${id}`);
    
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    saveState(canvas, id);
    msg.textContent = '그림 제출 완료! 🎉'; msg.className='msg ok';
    refreshFeed();
  };

  document.getElementById('sortSelect').onchange = (e)=>{
    currentSort = e.target.value;
    refreshFeed();
  };

  async function refreshFeed(){
    if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

    let subs = await loadSubs(id);
    if(!canManage) {
      subs = subs.filter(s=>!s.hidden); 
    }

    const feed = document.getElementById('subFeed');
    if(!feed) return;
    if(subs.length === 0){ feed.innerHTML = '<span class="small">등록된 그림이 없습니다.</span>'; return; }

    subs.sort((a,b)=>{
      if(b.pinned !== a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
      if(currentSort === 'popular') return (b.likes||0) - (a.likes||0);
      if(currentSort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
      if(currentSort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
    });

    let html = '';
    for(const s of subs){
      const isMine = s.visitor_id === myVid;
      const isLiked = (s.likedBy || []).includes(myVid);
      const isCover = (gallery.cover_image === s.image);
      const comments = await loadComments(s.id);

      html += `
        <div class="thumb-card ${s.pinned ? 'pinned-card' : ''}" data-sid="${s.id}">
          <span class="author">👤 ${escapeHtml(s.author || '익명')} ${isMine?'(나)':''}</span>
          ${isCover ? '<span class="badge public">🖼️ 대표 썸네일</span>' : ''}
          ${s.pinned ? '<span class="badge pinned">📌 고정됨</span>' : ''}
          ${s.hidden ? '<span class="badge hidden">🔒 비공개</span>' : ''}
          <img src="${s.image}" onclick="openModal('${s.image}', '${escapeHtml(s.author || '익명')}님의 작품')">
          
          <button class="like-btn ${isLiked ? 'liked' : ''}" data-sid="${s.id}">
            ${isLiked ? '💖 좋아요 완료' : '🤍 좋아요'} (${s.likes||0})
          </button>
          
          ${(canManage || isMine) ? `
            <div class="admin-actions">
              ${canManage ? `<button class="secondary setCoverBtn">${isCover ? '🖼️ 썸네일 해제' : '🖼️ 썸네일 지정'}</button>` : ''}
              ${canManage ? `<button class="ghost pinBtn">${s.pinned ? '📌 고정해제' : '📌 고정'}</button>` : ''}
              ${canManage ? `<button class="ghost hideBtn">${s.hidden ? '👁️ 공개' : '🔒 비공개'}</button>` : ''}
              <button class="danger deleteBtn">🗑️ 삭제</button>
            </div>
          ` : ''}

          <div class="comment-section">
            <div class="comment-list">
              ${comments.length === 0 ? '<div class="small" style="color:#aaa;">댓글이 없습니다.</div>' : 
                comments.map(c=>{
                  const isMyComment = (c.visitor_id === myVid) || canManage;
                  return `
                    <div class="comment-item" data-cid="${c.id}">
                      <span class="c-author">${escapeHtml(c.author)}</span>: <span class="c-content">${escapeHtml(c.content)}</span>
                      ${c.is_edited ? '<span class="edited-tag">(수정됨)</span>' : ''}
                      ${isMyComment ? `
                        <span class="comment-actions">
                          <button class="editCommentBtn">수정</button>
                          <button class="delCommentBtn">삭제</button>
                        </span>
                      ` : ''}
                    </div>
                  `;
                }).join('')
              }
            </div>
            <div class="row" style="gap:4px;">
              <input type="text" placeholder="댓글을 입력하세요..." class="commentInput" style="font-size:11px; padding:6px 8px; flex:1;">
              <button class="commentBtn" style="padding:6px 10px; font-size:11px;">등록</button>
            </div>
          </div>
        </div>
      `;
    }
    feed.innerHTML = html;

    feed.querySelectorAll('.thumb-card').forEach(card=>{
      const sid = card.dataset.sid;
      const target = subs.find(x=>x.id===sid);

      card.querySelector('.like-btn').onclick = async ()=>{
        target.likedBy = target.likedBy || [];
        if(target.likedBy.includes(myVid)){
          target.likedBy = target.likedBy.filter(v=>v!==myVid);
          target.likes = Math.max(0, (target.likes||0) - 1);
        } else {
          target.likedBy.push(myVid);
          target.likes = (target.likes||0) + 1;
        }
        await updateSub(target);
        refreshFeed();
      };

      const setCoverBtn = card.querySelector('.setCoverBtn');
      if(setCoverBtn){
        setCoverBtn.onclick = async ()=>{
          gallery.cover_image = (gallery.cover_image === target.image) ? '' : target.image;
          const ok = await saveGallery(id, gallery);
          if(ok) refreshFeed();
          else alert('썸네일 저장 실패!');
        };
      }

      const delBtn = card.querySelector('.deleteBtn');
      if(delBtn){
        delBtn.onclick = async ()=>{
          if(confirm('이 그림을 삭제하시겠습니까?')){ await deleteSub(sid); refreshFeed(); }
        };
      }

      const pinBtn = card.querySelector('.pinBtn');
      if(pinBtn){
        pinBtn.onclick = async ()=>{
          target.pinned = !target.pinned; 
          await updateSub(target);
          refreshFeed();
        };
      }

      const hideBtn = card.querySelector('.hideBtn');
      if(hideBtn){
        hideBtn.onclick = async ()=>{
          target.hidden = !target.hidden; 
          await updateSub(target);
          refreshFeed();
        };
      }

      const commentBtn = card.querySelector('.commentBtn');
      if(commentBtn){
        commentBtn.onclick = async ()=>{
          const input = card.querySelector('.commentInput');
          const val = input.value.trim();
          if(!val) return;
          const author = localStorage.getItem('visitor-nickname') || '익명';
          await addComment(sid, author, val);
          input.value = '';
          refreshFeed();
        };
      }

      card.querySelectorAll('.comment-item').forEach(cItem=>{
        const cid = cItem.dataset.cid;
        const editBtn = cItem.querySelector('.editCommentBtn');
        if(editBtn){
          editBtn.onclick = async ()=>{
            const currentContent = cItem.querySelector('.c-content').innerText;
            const updated = prompt('댓글을 수정하세요:', currentContent);
            if(updated !== null && updated.trim() !== '' && updated !== currentContent){
              const ok = await updateComment(cid, updated.trim());
              if(ok) refreshFeed();
              else alert('댓글 수정 실패!');
            }
          };
        }

        const delCBtn = cItem.querySelector('.delCommentBtn');
        if(delCBtn){
          delCBtn.onclick = async ()=>{
            if(confirm('이 댓글을 삭제하시겠습니까?')){
              const ok = await deleteComment(cid);
              if(ok) refreshFeed();
              else alert('댓글 삭제 실패!');
            }
          };
        }
      });
    });
  }

  refreshFeed();
  pollTimer = setInterval(refreshFeed, 4000);
}

route();
</script>
